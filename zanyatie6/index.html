<style>
:root{
  --navy:#0c2340; --navy-2:#123058; --graphite:#2b2e33; --graphite-soft:#585c63;
  --burgundy:#7c1327; --red:#c8102e; --paper:#f7f5f1; --paper-2:#efece5; --white:#ffffff;
  --line:#dfdbd2; --ok:#1f6f43; --shadow:0 12px 30px -14px rgba(12,35,64,.28); --radius:18px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--graphite);-webkit-font-smoothing:antialiased;}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
h1,h2,h3{text-wrap:balance;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#c9c3b6;border-radius:6px;}
a{color:inherit;} button{font-family:inherit;} img{max-width:100%;}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;}

.screen{display:none;min-height:100vh;}
.screen.active{display:block;animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  .screen.active{animation:none;}
  .navbtn,.chip,.trainer-card,.choice,.case-card{transition:none;}
}

.topbar{position:sticky;top:0;z-index:50;background:rgba(247,245,241,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px;}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);white-space:nowrap;cursor:pointer;}
.topbar .brand .logo-wrap{width:34px;height:34px;}

.navbtn{border:1px solid var(--line);background:var(--white);color:var(--navy);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;}
.navbtn:hover{border-color:var(--navy);}
.navbtn.primary{background:var(--red);border-color:var(--red);color:#fff;}
.navbtn.primary:hover{background:#a70d26;}
.navbtn.ghost{background:transparent;}
.navbtn[disabled]{opacity:.35;cursor:default;}
.progress-rail{height:4px;background:var(--line);width:100%;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--burgundy),var(--red));transition:width .3s;}

.wrap{max-width:1100px;margin:0 auto;padding:48px 24px 80px;}
.wrap.narrow{max-width:860px;}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--burgundy);font-weight:700;margin-bottom:14px;}
.kicker::before{content:"";width:22px;height:2px;background:var(--red);display:inline-block;}
h1.page-title{font-size:clamp(28px,4vw,44px);line-height:1.1;color:var(--navy);margin:0 0 12px;}
h2.section-title{font-size:clamp(21px,2.7vw,29px);color:var(--navy);margin:0 0 10px;line-height:1.2;}
.subtitle{font-size:17px;color:var(--graphite-soft);max-width:680px;line-height:1.6;}
.lede{font-size:14.5px;color:var(--graphite-soft);line-height:1.7;max-width:760px;}

.logo-wrap{position:relative;display:inline-block;}
.logo-wrap img{display:block;width:100%;height:100%;object-fit:contain;}
.logo-fallback{display:none;width:100%;height:100%;}
.logo-fallback svg{display:block;width:100%;height:100%;}
.logo-wrap img.err{display:none;}
.logo-wrap img.err + .logo-fallback{display:block;}
.hero-photo-wrap{position:relative;border-radius:var(--radius);overflow:hidden;background:linear-gradient(180deg,#2a4d7a 0%,#0c2340 55%,#081527 100%);min-height:340px;}
.hero-photo-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.hero-photo-wrap img.err{display:none;}
.hero-photo-fallback{position:absolute;inset:0;display:none;}
.hero-photo-wrap img.err + .hero-photo-fallback{display:block;}
.hero-photo-fallback svg{width:100%;height:100%;}

.cover{background:var(--navy);color:#fff;position:relative;overflow:hidden;}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(12,35,64,.94),rgba(12,35,64,.72) 55%,rgba(124,19,39,.55));z-index:1;}
.cover .hero-photo-wrap{position:absolute;inset:0;border-radius:0;min-height:0;}
.cover-inner{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:60px 24px 64px;}
.cover-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:56px;}
.cover-top .univ-name{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;}
.cover .logo-wrap{width:56px;height:56px;}
.cover-eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#f2c9c9;font-weight:700;margin-bottom:16px;}
.cover h1{font-size:clamp(32px,5vw,54px);line-height:1.08;margin:0 0 14px;}
.cover .cover-sub{font-size:clamp(16px,2vw,21px);font-weight:600;color:#dfe6ef;margin:0 0 20px;}
.cover .cover-question{font-size:15.5px;line-height:1.6;max-width:660px;color:#c9d3e0;border-left:3px solid var(--red);padding-left:16px;margin-bottom:32px;}
.cover-actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:36px;}
.btn{border:none;border-radius:10px;padding:13px 22px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px;}
.btn-red{background:var(--red);color:#fff;} .btn-red:hover{background:#a70d26;transform:translateY(-1px);}
.btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55);} .btn-outline:hover{border-color:#fff;}
.btn-navy{background:var(--navy);color:#fff;} .btn-navy:hover{background:var(--navy-2);}
.cover-author{display:flex;gap:12px;align-items:center;color:#c9d3e0;font-size:13px;border-top:1px solid rgba(255,255,255,.18);padding-top:18px;max-width:520px;}
.cover-author b{color:#fff;display:block;font-size:14px;}

.grid{display:grid;gap:16px;}
.grid.cols-2{grid-template-columns:1fr 1fr;} .grid.cols-3{grid-template-columns:repeat(3,1fr);} .grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:820px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.card h3{margin:0 0 8px;color:var(--navy);font-size:16px;}
.card p{margin:0;font-size:13.5px;color:var(--graphite-soft);line-height:1.6;}
.card.accent-left{border-left:4px solid var(--red);}
.card.navy{background:var(--navy);color:#fff;border-color:var(--navy);} .card.navy h3{color:#fff;} .card.navy p{color:#c9d3e0;}
.card.burgundy{background:var(--burgundy);color:#fff;border-color:var(--burgundy);} .card.burgundy p{color:#ecd8dc;}
.stat-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:24px 18px;text-align:center;box-shadow:var(--shadow);}
.stat-card .num{font-family:'Fraunces',serif;font-size:clamp(24px,3.6vw,36px);color:var(--red);font-weight:700;line-height:1;}
.stat-card .lbl{margin-top:8px;font-size:13px;color:var(--graphite-soft);}

.roadmap{display:flex;flex-wrap:wrap;gap:0;align-items:stretch;}
.roadmap .node{flex:1 1 130px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;font-size:12px;font-weight:600;color:var(--navy);box-shadow:var(--shadow);}
.roadmap .arrow{display:flex;align-items:center;justify-content:center;color:var(--red);font-size:18px;flex:0 0 24px;}
@media (max-width:760px){.roadmap{flex-direction:column;}.roadmap .arrow{transform:rotate(90deg);}}

.timeline{position:relative;padding-left:28px;}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line);}
.timeline-step{position:relative;padding-bottom:22px;}
.timeline-step::before{content:attr(data-n);position:absolute;left:-28px;top:0;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.timeline-step h4{margin:0 0 4px;color:var(--navy);font-size:14.5px;}
.timeline-step p{margin:0;font-size:13px;color:var(--graphite-soft);}

.fork{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media (max-width:700px){.fork{grid-template-columns:1fr;}}
.branch{border-radius:var(--radius);padding:20px;border:1.5px solid var(--line);}
.branch.left{background:#f2f1ec;} .branch.right{background:#fff5f2;border-color:#f0c9c4;}
.branch h4{margin:0 0 10px;color:var(--navy);}
.branch ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--graphite-soft);line-height:1.7;}

.scale-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0;}
.scale-cap{font-size:12.5px;color:var(--graphite-soft);max-width:520px;text-align:center;}

.quote-slide{background:var(--navy);color:#fff;border-radius:var(--radius);padding:48px 40px;text-align:center;position:relative;overflow:hidden;}
.quote-slide::before{content:"\201C";position:absolute;top:-10px;left:24px;font-family:'Fraunces',serif;font-size:140px;color:rgba(200,16,46,.35);line-height:1;}
.quote-slide blockquote{margin:0 auto 16px;max-width:700px;font-family:'Fraunces',serif;font-size:clamp(17px,2.6vw,24px);line-height:1.42;position:relative;z-index:1;}
.quote-slide cite{font-style:normal;color:#e3b9c1;font-size:13px;letter-spacing:.05em;}

.qr-zone{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1.5px dashed #c7bfae;border-radius:14px;padding:14px;background:#fbfaf7;}
.qr-box{width:88px;height:88px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;}
.qr-box canvas,.qr-box img{width:100%;height:100%;}
.qr-meta{flex:1;min-width:180px;} .qr-meta b{display:block;font-size:13.5px;color:var(--navy);margin-bottom:6px;}
.qr-meta input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;margin-bottom:6px;}
.qr-meta button{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;}

.slide-shell{background:var(--white);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:36px clamp(20px,4.5vw,52px);min-height:520px;}
.slide-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--graphite-soft);margin-bottom:16px;}
.slide-controls{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px;}
.dot-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:460px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);cursor:pointer;}
.dot.active{background:var(--red);width:16px;border-radius:4px;}
.step-hint{font-size:11.5px;color:var(--burgundy);text-align:center;margin-top:6px;font-style:italic;}

.choice{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 15px;margin-bottom:9px;cursor:pointer;font-size:14px;color:var(--graphite);transition:.15s;}
.choice:hover{border-color:var(--navy);}
.choice.correct{border-color:var(--ok);background:#e9f5ee;} .choice.wrong{border-color:var(--red);background:#fbeceb;}
.choice b{color:var(--navy);margin-right:6px;}
.explain-box{margin-top:12px;border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.6;}
.explain-box.ok{background:#e9f5ee;color:#1c5f3a;} .explain-box.no{background:#fbeceb;color:#8c2a26;} .explain-box.info{background:#eef2f7;color:var(--navy);}

.trainer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:940px){.trainer-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:620px){.trainer-grid{grid-template-columns:1fr;}}
.trainer-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;box-shadow:var(--shadow);transition:.18s;display:flex;flex-direction:column;gap:8px;}
.trainer-card:hover{transform:translateY(-3px);border-color:var(--navy);}
.trainer-card .n{font-family:'Fraunces',serif;font-size:24px;color:var(--red);font-weight:700;}
.trainer-card h3{margin:0;color:var(--navy);font-size:15.5px;}
.trainer-card p{margin:0;font-size:12.5px;color:var(--graphite-soft);flex:1;}
.trainer-card .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--burgundy);font-weight:700;}

.case-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;box-shadow:var(--shadow);transition:.18s;display:flex;flex-direction:column;gap:8px;}
.case-card:hover{transform:translateY(-3px);border-color:var(--navy);}
.case-card h3{margin:0;color:var(--navy);font-size:15.5px;}
.case-card p{margin:0;font-size:12.5px;color:var(--graphite-soft);}
.case-card .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--burgundy);font-weight:700;}

.sort-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.sort-layout.cols-3{grid-template-columns:1fr 1fr 1fr;}
.sort-layout.cols-4{grid-template-columns:1fr 1fr;}
@media (max-width:760px){.sort-layout,.sort-layout.cols-3,.sort-layout.cols-4{grid-template-columns:1fr;}}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--graphite);display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
.chip button{border:none;background:none;cursor:pointer;font-size:11px;font-weight:700;padding:0;color:var(--navy);}
.bucket{border:1.5px dashed #c7bfae;border-radius:14px;padding:13px;min-height:100px;background:#fbfaf7;}
.bucket h4{margin:0 0 10px;font-size:13px;color:var(--navy);}

textarea.answer{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13.5px;font-family:inherit;min-height:72px;resize:vertical;}
label.q{display:block;font-size:13.5px;font-weight:600;color:var(--navy);margin:14px 0 6px;}

.map-flow{display:flex;flex-direction:column;align-items:center;gap:0;}
.map-node{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 20px;font-weight:600;color:var(--navy);text-align:center;box-shadow:var(--shadow);max-width:560px;width:100%;font-size:13.5px;}
.map-node.final{background:var(--navy);color:#fff;border-color:var(--navy);font-family:'Fraunces',serif;font-size:16px;}
.map-node.zone{border-color:var(--burgundy);}
.map-arrow{color:var(--red);font-size:20px;line-height:1;padding:3px 0;}

.ladder{display:flex;flex-direction:column-reverse;gap:8px;max-width:520px;margin:0 auto;}
.ladder .rung{border-radius:12px;padding:12px 16px;font-size:13px;font-weight:600;color:#fff;display:flex;justify-content:space-between;align-items:center;}

.pyramid{display:flex;flex-direction:column;align-items:center;gap:6px;}

.pyramid .level small{display:block;font-weight:500;font-size:11px;opacity:.85;margin-top:3px;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;}

.rank-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;}
.rank-item .pos{color:var(--red);font-weight:700;margin-right:8px;}
.rank-item.correct{border-color:var(--ok);background:#e9f5ee;}
.rank-item.wrong{border-color:var(--red);background:#fbeceb;}

.msel-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px;font-size:13.5px;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}

table.cmp th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-weight:600;}

table.cmp tr:nth-child(even) td{background:#faf9f6;}
table.cmp td:first-child{font-weight:600;color:var(--navy);white-space:nowrap;}

.role-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);}
.role-card h4{margin:0 0 8px;color:var(--navy);font-size:14.5px;}
.role-card ul{margin:0;padding-left:18px;font-size:12.8px;color:var(--graphite-soft);line-height:1.65;}

.site-footer{border-top:1px solid var(--line);padding:26px 24px;text-align:center;font-size:12px;color:var(--graphite-soft);}
.note{font-size:12px;color:var(--graphite-soft);font-style:italic;margin-top:9px;}
hr.sep{border:none;border-top:1px solid var(--line);margin:22px 0;}
</style>

/* ranking exercise */
function rankingExercise(key, items){
  const chosen = state.rankings[key] || [];
  const pool = items.filter(x=>!chosen.includes(x));
  const checked = state.rankChecked[key];
  return `
  <div class="pool" style="margin-bottom:14px;">${pool.map(x=>`<span class="chip" onclick="pickRank('${key}','${x.replace(/'/g,"\\'")}',${items.length})">${x}</span>`).join("")||'<span class="note">Все карточки расставлены.</span>'}</div>
  <div class="bucket" style="min-height:100px;"><h4>Ваша последовательность</h4>
    ${chosen.map((x,i)=>{
      let cls='';
      if(checked) cls = (items[i]===x) ? 'correct' : 'wrong';
      return `<div class="rank-item ${cls}"><span><span class="pos">${i+1}.</span>${x}</span><button class="navbtn" style="padding:3px 10px;font-size:11px;" onclick="unRank('${key}','${x.replace(/'/g,"\\'")}')">убрать</button></div>`;
    }).join("")}
  </div>
  ${chosen.length===items.length ? `<button class="btn btn-navy" style="margin-top:12px;" onclick="checkRank('${key}')">Проверить порядок</button>` : ''}
  ${checked?`<div class="explain-box ${chosen.every((x,i)=>items[i]===x)?'ok':'no'}" style="margin-top:12px;">${chosen.every((x,i)=>items[i]===x)?'✓ Порядок верный.':'✕ Есть ошибки — красным отмечены позиции не на своём месте.'}</div>`:''}`;
}
window.pickRank=function(key,item,total){
  if(!state.rankings[key]) state.rankings[key]=[];
  state.rankings[key].push(item);
  state.rankChecked[key]=false;
  save(); render();
};
window.unRank=function(key,item){
  state.rankings[key]=(state.rankings[key]||[]).filter(x=>x!==item);
  state.rankChecked[key]=false;
  save(); render();
};
window.checkRank=function(key){ state.rankChecked[key]=true; save(); render(); };

function multiSelectExercise(key, items){
  const picked = state.multiSel[key] || {};
  const checked = state.multiSelChecked[key];
  return `${items.map((it,i)=>{
    let style='';
    if(checked){
      if(it.correct) style = picked[i] ? 'border-color:#1f6f43;background:#e9f5ee;' : 'border-color:#c8102e;background:#fbeceb;';
      else style = picked[i] ? 'border-color:#c8102e;background:#fbeceb;' : '';
    }
    return `<label class="msel-item" style="${style}"><input type="checkbox" ${picked[i]?'checked':''} onchange="toggleMultiSel('${key}',${i})"> ${it.text}</label>`;
  }).join("")}
  <button class="btn btn-navy" style="margin-top:6px;" onclick="checkMultiSel('${key}')">Проверить</button>
  ${checked?`<div class="explain-box ${items.every((it,i)=>!!picked[i]===!!it.correct)?'ok':'no'}" style="margin-top:12px;">${items.every((it,i)=>!!picked[i]===!!it.correct)?'✓ Все выбраны верно.':'✕ Есть ошибки — зелёным отмечены верные, красным — неверно отмеченные или пропущенные позиции.'}</div>`:''}`;
}
window.toggleMultiSel=function(key,i){

  save(); render();

function bucketSorter(sortKey, items, buckets){
  const placed = state.sorters[sortKey]||{};
  const pool = items.filter(([txt])=>!(txt in placed));
  const cols = Math.min(buckets.length,4);
  return `
  <div class="pool" style="margin-bottom:14px;">${pool.map(([txt,correct])=>`
    <span class="chip">${txt}
      ${buckets.map(b=>`<button onclick="sortPick('${sortKey}','${txt.replace(/'/g,"\\'")}','${b.key}',${b.key===correct})">→${b.label.split(' ')[0]}</button>`).join("")}
    </span>`).join("")||'<span class="note">Все карточки распределены.</span>'}</div>
  <div class="sort-layout ${cols===3?'cols-3':cols===4?'cols-4':''}">
    ${buckets.map(b=>`<div class="bucket"><h4>${b.label}</h4>${Object.entries(placed).filter(([,v])=>v.bucket===b.key).map(([txt,v])=>`<span class="chip" style="border-color:${v.ok?'#1f6f43':'#c8102e'};" onclick="unSort('${sortKey}','${txt.replace(/'/g,"\\'")}')">${v.ok?'✓':'✕'} ${txt}</span>`).join("")}</div>`).join("")}
  </div>`;
}
window.sortPick=function(sortKey,item,bucketKey,isCorrect){
  if(!state.sorters[sortKey]) state.sorters[sortKey]={};
  state.sorters[sortKey][item]={bucket:bucketKey, ok:isCorrect};
  save(); render();
};
window.unSort=function(sortKey,item){ if(state.sorters[sortKey]) delete state.sorters[sortKey][item]; save(); render(); };
function answerBox(id){
  const val = state.refl[id]||'';
  return `<textarea class="answer" oninput="state.refl['${id}']=this.value;save();">${val}</textarea>`;
}

window.exportAnswers=async function(){
  const out = buildAnswersText();
  const status = document.getElementById('export-status');
  if(window.claude && window.claude.use){

      const downloads = await window.claude.use('downloads');
      if(downloads){

        if(status) status.textContent = 'Файл сохранён.';

function goSlide(i, revealMode){
  state.slide = Math.max(0, Math.min(SLIDES.length-1, i));
  const s = SLIDES[state.slide];
  if(revealMode==='full') state.stage[state.slide] = s.maxStep||0;
  else if(revealMode==='reset') state.stage[state.slide] = 0;
  save(); render(); window.scrollTo({top:0,behavior:'smooth'});
}
function advanceSlide(){
  const i=state.slide, s=SLIDES[i], max=s.maxStep||0, cur=state.stage[i]||0;
  if(cur<max){ state.stage[i]=cur+1; save(); render(); return; }
  if(i<SLIDES.length-1) goSlide(i+1,'reset'); else render();
}
function backSlide(){
  const i=state.slide, cur=state.stage[i]||0;
  if(cur>0){ state.stage[i]=cur-1; save(); render(); return; }
  if(i>0) goSlide(i-1,'full');
}
document.addEventListener('keydown', (e)=>{
  if(currentScreen!=='presentation') return;
  if(['ArrowRight','PageDown',' ','Spacebar'].includes(e.key)){ e.preventDefault(); advanceSlide(); }
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); backSlide(); }
});

function renderQr(id){
  const url = document.getElementById(`qrurl-${id}`).value.trim();
  const box = document.getElementById(`qrbox-${id}`);
  if(!box) return;
  box.innerHTML='';
  if(!url){ box.innerHTML='<span style="font-size:10px;color:#999;">QR</span>'; return; }
  if(typeof QRCode==='undefined'){ box.innerHTML='<span style="font-size:9px;color:#c8102e;padding:4px;text-align:center;">Библиотека QR не загрузилась</span>'; return; }
  try{ new QRCode(box, {text:url, width:88, height:88, colorDark:"#0c2340", colorLight:"#ffffff"}); }
  catch(e){ box.innerHTML='<span style="font-size:9px;color:#c8102e;">ошибка</span>'; }
}

      <div class="card"><h3>4. Сравнительное задание</h3><p>Сравните трудовой договор и договор ГПХ по 10 критериям: стороны, предмет, оплата, рабочее место, режим времени, подчинение, ответственность, результат, возможность привлечения третьих лиц, гарантии.</p></div>
      <div class="card"><h3>5. Судебное задание</h3><p>По делу медработников ВКО объясните, в чём различались подходы первой инстанции, апелляции и Верховного Суда. Какую методологическую ошибку исправил Верховный Суд?</p></div>

function render(){
  const app=document.getElementById('app');
  let html='';
  switch(currentScreen){
    case 'cover': html=screenCover(); break;
    case 'roadmap': html=screenRoadmap(); break;
    case 'presentation': html=screenPresentation(); break;
    case 'trainers': html=screenTrainers(); break;
    case 'cases': html=screenCases(); break;
    case 'p2p': html=screenP2P(); break;
    case 'map': html=screenMap(); break;
    case 'after': html=screenAfter(); break;
    default: html=screenCover();
  }
  app.innerHTML = `<div class="screen active">${html}</div>`;
  updateProgress();
  autoRenderQrZones();
}
function updateProgress(){
  const order=['cover','roadmap','presentation','trainers','cases','p2p','map','after'];
  let pct=0;
  if(currentScreen==='presentation'){ pct = 10 + (state.slide/(SLIDES.length-1))*55; }
  else{ const idx=order.indexOf(currentScreen); pct = [3,7,10,72,80,88,94,100][idx] ?? 0; }
  document.getElementById('progressFill').style.width=pct+'%';
}
render();
</script>
