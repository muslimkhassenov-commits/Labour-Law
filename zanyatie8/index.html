<style>
:root{

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}

:focus-visible{outline:2px solid var(--red);outline-offset:2px;}

.screen{display:none;min-height:100vh;}
.screen.active{display:block;animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.topbar{position:sticky;top:0;z-index:50;background:rgba(247,245,241,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap;}

.card.burgundy{background:var(--burgundy);color:#fff;border-color:var(--burgundy);} .card.burgundy p{color:#ecd8dc;}

.timeline-step::before{content:attr(data-n);position:absolute;left:-28px;top:0;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.timeline-step h4{margin:0 0 4px;color:var(--navy);font-size:14.5px;}
.timeline-step p{margin:0;font-size:13px;color:var(--graphite-soft);}

.fork{display:grid;grid-template-columns:1fr 1fr;gap:18px;}

.branch{border-radius:var(--radius);padding:20px;border:1.5px solid var(--line);}
.branch.left{background:#f2f1ec;} .branch.right{background:#fff5f2;border-color:#f0c9c4;}

.scale-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0;}

.quote-slide{background:var(--navy);color:#fff;border-radius:var(--radius);padding:48px 40px;text-align:center;position:relative;overflow:hidden;}

.quote-slide cite{font-style:normal;color:#e3b9c1;font-size:13px;letter-spacing:.05em;}

.qr-zone{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1.5px dashed #c7bfae;border-radius:14px;padding:14px;background:#fbfaf7;}
.qr-box{width:88px;height:88px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;}
.qr-box canvas,.qr-box img{width:100%;height:100%;}
.qr-meta{flex:1;min-width:180px;} .qr-meta b{display:block;font-size:13.5px;color:var(--navy);margin-bottom:6px;}
.qr-meta input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;margin-bottom:6px;}
.qr-meta button{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;}

.slide-shell{background:var(--white);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:36px clamp(20px,4.5vw,52px);min-height:520px;}

.slide-controls{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px;}
.dot-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:460px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);cursor:pointer;}
.dot.active{background:var(--red);width:16px;border-radius:4px;}
.step-hint{font-size:11.5px;color:var(--burgundy);text-align:center;margin-top:6px;font-style:italic;}

.choice{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 15px;margin-bottom:9px;cursor:pointer;font-size:14px;color:var(--graphite);transition:.15s;}
.choice:hover{border-color:var(--navy);}
.choice.correct{border-color:var(--ok);background:#e9f5ee;} .choice.wrong{border-color:var(--red);background:#fbeceb;}
.choice b{color:var(--navy);margin-right:6px;}
.explain-box{margin-top:12px;border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.6;}
.explain-box.ok{background:#e9f5ee;color:#1c5f3a;} .explain-box.no{background:#fbeceb;color:#8c2a26;} .explain-box.info{background:#eef2f7;color:var(--navy);}

.trainer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}

.trainer-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;box-shadow:var(--shadow);transition:.18s;display:flex;flex-direction:column;gap:8px;}
.trainer-card:hover{transform:translateY(-3px);border-color:var(--navy);}
.trainer-card .n{font-family:'Fraunces',serif;font-size:24px;color:var(--red);font-weight:700;}

.sort-layout.cols-4{grid-template-columns:1fr 1fr;}

window.pickChoiceExplain=function(id,i,correctIdx,explain){

  if(ex){ ex.className='explain-box '+(i===correctIdx?'ok':'no'); ex.style.display='block'; ex.innerHTML=(i===correctIdx?'✓ Верно. ':'✕ Неверно. ')+(explain||''); }

};
function revealBox(id, question, answer){

}

/* stepped reveal helper */
function steps(stage, items){ return items.filter((_,i)=>stage>=i+1).join(""); }
function stepHint(stage,max){ return stage<max ? `<div class="step-hint">Нажмите «Далее» / клавишу клика, чтобы показать ещё (${stage}/${max})</div>` : ""; }

/* ranking exercise */
function rankingExercise(key, items){
  const chosen = state.rankings[key] || [];
  const pool = items.filter(x=>!chosen.includes(x));
  const checked = state.rankChecked[key];
  return `
  <div class="pool" style="margin-bottom:14px;">${pool.map(x=>`<span class="chip" onclick="pickRank('${key}','${x.replace(/'/g,"\\'")}',${items.length})">${x}</span>`).join("")||'<span class="note">Все карточки расставлены.</span>'}</div>
  <div class="bucket" style="min-height:100px;"><h4>Ваша последовательность</h4>
    ${chosen.map((x,i)=>{
      let cls='';
      if(checked) cls = (items[i]===x) ? 'correct' : 'wrong';
      return `<div class="rank-item ${cls}"><span><span class="pos">${i+1}.</span>${x}</span><button class="navbtn" style="padding:3px 10px;font-size:11px;" onclick="unRank('${key}','${x.replace(/'/g,"\\'")}')">убрать</button></div>`;
    }).join("")}
  </div>
  ${chosen.length===items.length ? `<button class="btn btn-navy" style="margin-top:12px;" onclick="checkRank('${key}')">Проверить порядок</button>` : ''}
  ${checked?`<div class="explain-box ${chosen.every((x,i)=>items[i]===x)?'ok':'no'}" style="margin-top:12px;">${chosen.every((x,i)=>items[i]===x)?'✓ Порядок верный.':'✕ Есть ошибки — красным отмечены позиции не на своём месте.'}</div>`:''}`;
}
window.pickRank=function(key,item,total){
  if(!state.rankings[key]) state.rankings[key]=[];
  state.rankings[key].push(item);
  state.rankChecked[key]=false;
  save(); render();
};
window.unRank=function(key,item){
  state.rankings[key]=(state.rankings[key]||[]).filter(x=>x!==item);
  state.rankChecked[key]=false;
  save(); render();
};
window.checkRank=function(key){ state.rankChecked[key]=true; save(); render(); };

/* multi-select exercise */
function multiSelectExercise(key, items){
  const picked = state.multiSel[key] || {};
  const checked = state.multiSelChecked[key];
  return `${items.map((it,i)=>{
    let style='';
    if(checked){
      if(it.correct) style = picked[i] ? 'border-color:#1f6f43;background:#e9f5ee;' : 'border-color:#c8102e;background:#fbeceb;';
      else style = picked[i] ? 'border-color:#c8102e;background:#fbeceb;' : '';
    }
    return `<label class="msel-item" style="${style}"><input type="checkbox" ${picked[i]?'checked':''} onchange="toggleMultiSel('${key}',${i})"> ${it.text}</label>`;
  }).join("")}
  <button class="btn btn-navy" style="margin-top:6px;" onclick="checkMultiSel('${key}')">Проверить</button>
  ${checked?`<div class="explain-box ${items.every((it,i)=>!!picked[i]===!!it.correct)?'ok':'no'}" style="margin-top:12px;">${items.every((it,i)=>!!picked[i]===!!it.correct)?'✓ Все выбраны верно.':'✕ Есть ошибки — зелёным отмечены верные, красным — неверно отмеченные или пропущенные позиции.'}</div>`:''}`;
}
window.toggleMultiSel=function(key,i){
  if(!state.multiSel[key]) state.multiSel[key]={};
  state.multiSel[key][i]=!state.multiSel[key][i];
  state.multiSelChecked[key]=false;
  save(); render();
};
window.checkMultiSel=function(key){ state.multiSelChecked[key]=true; save(); render(); };

function bucketSorter(sortKey, items, buckets){
  const placed = state.sorters[sortKey]||{};
  const pool = items.filter(([txt])=>!(txt in placed));
  const cols = Math.min(buckets.length,4);
  return `
  <div class="pool" style="margin-bottom:14px;">${pool.map(([txt,correct])=>`
    <span class="chip">${txt}
      ${buckets.map(b=>`<button onclick="sortPick('${sortKey}','${txt.replace(/'/g,"\\'")}','${b.key}',${b.key===correct})">→${b.label.split(' ')[0]}</button>`).join("")}
    </span>`).join("")||'<span class="note">Все карточки распределены.</span>'}</div>
  <div class="sort-layout ${cols===3?'cols-3':cols===4?'cols-4':cols>=5?'cols-5':''}">
    ${buckets.map(b=>`<div class="bucket"><h4>${b.label}</h4>${Object.entries(placed).filter(([,v])=>v.bucket===b.key).map(([txt,v])=>`<span class="chip" style="border-color:${v.ok?'#1f6f43':'#c8102e'};" onclick="unSort('${sortKey}','${txt.replace(/'/g,"\\'")}')">${v.ok?'✓':'✕'} ${txt}</span>`).join("")}</div>`).join("")}
  </div>`;
}
window.sortPick=function(sortKey,item,bucketKey,isCorrect){
  if(!state.sorters[sortKey]) state.sorters[sortKey]={};
  state.sorters[sortKey][item]={bucket:bucketKey, ok:isCorrect};
  save(); render();
};
window.unSort=function(sortKey,item){ if(state.sorters[sortKey]) delete state.sorters[sortKey][item]; save(); render(); };
function answerBox(id){
  const val = state.refl[id]||'';
  return `<textarea class="answer" oninput="state.refl['${id}']=this.value;save();">${val}</textarea>`;
}

function caseDetail(id, opts){
  const ladderHtml = opts.ladder ? `<div class="timeline" style="margin-top:14px;">${opts.ladder.map((l,i)=>timelineStep(i+1,l.label,l.text)).join("")}</div>` : '';
  return `<div class="kicker">${opts.tag}</div><h2 class="section-title">${opts.title}</h2>
  <div class="card accent-left" style="margin-bottom:14px;"><p style="font-size:13.5px;"><i>${opts.facts}</i></p></div>
  <div class="grid cols-2" style="margin-bottom:14px;">
    ${infoCard("Позиция работника",opts.employeePosition)}
    ${infoCard("Позиция работодателя",opts.employerPosition)}
  </div>
  ${opts.vote?votingTool('case-'+id):''}
  ${revealBox('case-decide-'+id, opts.question, `${opts.evidence?`<p><b>Доказательства:</b> ${opts.evidence}</p>`:''}${ladderHtml || `<p>${opts.decision||''}</p>`}<div class="card burgundy" style="margin-top:12px;"><p style="color:#fff;">${opts.lesson}</p></div>`)}
  ${opts.specialOpinion?specialOpinionBox('case-'+id):''}
  ${opts.teacherNote?teacherNote(opts.teacherNote):''}`;
}

  <label class="q">3. Соответствуют ли реальные факты основанию?</label>${answerBox('t0-f3')}
  <label class="q">4. Какая процедура обязательна?</label>${answerBox('t0-f4')}
  <label class="q">5. Есть ли ограничения и гарантии?</label>${answerBox('t0-f5')}
  <label class="q">6. Чем это может быть доказано?</label>${answerBox('t0-f6')}
  ${allFilled ? revealBox('t0-final','Теперь сформулируйте итоговый вывод: законно ли увольнение?','Правильный вывод зависит от того, что вы установили на каждом из шести этапов — проверьте, нет ли пробела хотя бы в одном из них, прежде чем отвечать.') : '<p class="note">Заполните все шесть полей, чтобы открыть финальный вопрос.</p>'}
  ${trainerTakeaway(0,"Нельзя перейти к финальному ответу, минуя хотя бы один из шести этапов юридического анализа.")}`;
},
// 2. Какое основание прекращения?
()=>`<div class="kicker">Тренажёр 2 · Начальный</div><h2 class="section-title">Какое основание прекращения?</h2>
${trainerFabula("15 фабул — распределите по виду основания прекращения трудового договора. Истечение срока среди вариантов не рассматривается.")}
${bucketSorter('t1',[
  ["Стороны подписали соглашение о прекращении с выплатой компенсации","agreement"],
  ["Работник подал заявление за месяц до увольнения без объяснения причин","employee"],
  ["Работника увольняют за прогул","employer"],
  ["Работодатель — физическое лицо прекратил деятельность","circumstance"],
  ["Работник отказался от перевода вместе с работодателем в другой город","refusal"],
  ["Работник временно восстановлен судом на прежней должности, которую занимал другой сотрудник","circumstance"],
  ["Работник переходит работать в другую компанию по переводу, согласованному тремя сторонами","transfer"],
  ["При приёме на работу обнаружено, что у работника отсутствует обязательный документ об образовании","defect"],
  ["Работник избран депутатом местного представительного органа","elected"],
  ["Работодатель снизил работнику оклад без изменения функции","none"],
  ["Работника увольняют за недостаточную квалификацию по результатам аттестации","employer"],
  ["Работник уведомил о расторжении из-за систематической задержки зарплаты работодателем","employee"],
  ["Работника отстранили от работы на один день до медицинского осмотра","none"],
  ["Работник и работодатель договорились прекратить договор с 1 марта","agreement"],
  ["Работника увольняют по сокращению штата","employer"],
],[
  {key:"agreement",label:"Соглашение сторон"},{key:"employer",label:"Инициатива работодателя"},{key:"employee",label:"Желание работника"},
  {key:"circumstance",label:"Обстоятельство вне воли сторон"},{key:"refusal",label:"Отказ продолжать отношения"},{key:"transfer",label:"Перевод к другому работодателю"},
  {key:"defect",label:"Нарушение условий заключения"},{key:"elected",label:"Выборная / несовместимая должность"},{key:"none",label:"Прекращения нет"},
])}
${trainerTakeaway(1,"Девять институтов внешне похожи («человек перестаёт работать»), но у каждого свой юридический состав и своя процедура.")}`,
// 3. Есть ли соглашение сторон?
()=>`<div class="kicker">Тренажёр 3 · Начальный</div><h2 class="section-title">Есть ли соглашение сторон?</h2>
${trainerFabula("Шаг 1 — работодатель: «Прекратим договор 1 июня, два оклада». Шаг 2 — работник: «Согласен, но с 15 июня». Шаг 3 — работодатель: «Согласны на 15 июня, два оклада». Шаг 4 — работник: «Хорошо».")}
${choiceListFull('t2',["На шаге 1","На шаге 2","На шаге 3","На шаге 4"],3,"Пока стороны называют разные даты или условия, это встречные предложения, а не соглашение. Совпадение воли возникает только тогда, когда последняя сторона безоговорочно принимает последнее предложение — на шаге 4.")}
${trainerTakeaway(2,"Соглашение возникает в момент полного совпадения воли обеих сторон по всем условиям, а не на любом промежуточном шаге переговоров.")}`,
// 4. Инициатива работника
()=>`<div class="kicker">Тренажёр 4 · Начальный</div><h2 class="section-title">Инициатива работника</h2>
${trainerFabula("Восстановите стандартную хронологию прекращения по инициативе работника.")}
${rankingExercise('t3',["Работник подаёт письменное уведомление работодателю","Начинается течение месячного срока уведомления","Работник вправе отозвать уведомление в течение этого срока","По истечении срока работник вправе прекратить работу"])}
${trainerTakeaway(3,"Срок уведомления — это не разрешение работодателя, а период, в течение который он может организационно подготовиться, а работник — передумать.")}`,
// 5. Работодатель нарушает договор
()=>`<div class="kicker">Тренажёр 5 · Начальный</div><h2 class="section-title">Работодатель нарушает договор</h2>
${trainerFabula("Работодатель систематически задерживает заработную плату. Восстановите правильную последовательность действий работника.")}
${rankingExercise('t4',["Работник письменно уведомляет работодателя о нарушении","Истекают 7 дней","Нарушение продолжается","Работник уведомляет о расторжении не позднее чем за 3 рабочих дня"])}
${trainerTakeaway(4,"Сокращённый срок уведомления (3 рабочих дня вместо месяца) — это следствие уже зафиксированного и не устранённого нарушения со стороны работодателя.")}`,
// 6. Есть ли состав дисциплинарного проступка?
()=>`<div class="kicker">Тренажёр 6 · Начальный</div><h2 class="section-title">Есть ли состав дисциплинарного проступка?</h2>
${trainerFabula("Для каждой фабулы заполните все четыре элемента состава, прежде чем система позволит сделать вывод.")}
<h3 style="color:var(--navy);">Пример А</h3>
<div class="card accent-left" style="margin-bottom:10px;"><p style="font-size:13.5px;"><i>Менеджер не выполнил план продаж.</i></p></div>
${revealBox('t5-a','Можно ли установить полный состав по этим фактам?','Субъект можно установить. Объект потенциально определим. Но одно невыполнение плана ещё не раскрывает объективную сторону (какую конкретно обязанность работник нарушил), а вина также автоматически не установлена.')}
<h3 style="color:var(--navy);">Пример Б</h3>
<div class="card accent-left" style="margin-bottom:10px;"><p style="font-size:13.5px;"><i>Работник обязан был подготовить отчёт согласно подписанной должностной инструкции, имел все необходимые данные и сознательно решил его не готовить.</i></p></div>
${revealBox('t5-b','Установлен ли состав?','Да: субъект — работник; объект — трудовая дисциплина; объективная сторона — неисполнение конкретной обязанности; субъективная сторона — умысел.')}
<p class="q" style="font-weight:700;color:var(--navy);margin-top:10px;">Состав есть. Значит ли это, что увольнение автоматически законно?</p>
${revealBox('t5-b2','Ответ','Нет. Теперь необходимо проверить основание конкретного взыскания (повторность или иное специальное основание) и процедуру.')}
<h3 style="color:var(--navy);">Пример В</h3>
<div class="card accent-left" style="margin-bottom:10px;"><p style="font-size:13.5px;"><i>Работник не выполнил поручение, которое вообще не относится к его трудовой функции.</i></p></div>
${revealBox('t5-c','Установлен ли состав?','Не установлена необходимая объективная сторона дисциплинарного проступка — обязанность за пределами функции не может считаться нарушенной трудовой обязанностью.')}
${trainerTakeaway(5,"Состав дисциплинарного проступка — это всегда совокупность всех четырёх элементов; отсутствие любого из них делает вывод о проступке преждевременным.")}`,
// 7. Конструктор состава проступка
()=>`<div class="kicker">Тренажёр 7 · Начальный</div><h2 class="section-title">Конструктор состава проступка</h2>
${trainerFabula("Распределите карточки по элементам состава дисциплинарного проступка.")}
${bucketSorter('t6',[
  ["Работник","subject"],["Правила внутреннего распорядка","object"],["Неявка на работу","actus"],
  ["Умышленное поведение","mens"],["Неосторожность","mens"],["Больничный","exclude"],
  ["Невыполненный план","exclude"],["Обязанность не установлена","exclude"],
],[{key:"subject",label:"Субъект"},{key:"object",label:"Объект"},{key:"actus",label:"Объективная сторона"},{key:"mens",label:"Субъективная сторона"},{key:"exclude",label:"Исключает или ставит под сомнение ответственность"}])}
${trainerTakeaway(6,"Не каждый факт укладывается в один из четырёх элементов состава — часть фактов, напротив, ослабляет или исключает ответственность.")}`,
// 8. КПЭ или проступок?
()=>`<div class="kicker">Тренажёр 8 · Начальный</div><h2 class="section-title">КПЭ или проступок?</h2>
${trainerFabula("По логике Нуртекешовой: факты добавляются постепенно. После каждого — спросите себя, как меняются объективная и субъективная стороны.")}
${revealBox('t7-1','Факт 1: план продаж не выполнен. Что с объективной и субъективной стороной?','Объективная сторона пока не раскрыта: неясно, какую конкретно обязанность нарушил работник. Субъективная сторона не установлена вовсе.')}
${revealBox('t7-2','Факт 2: рынок в целом снизился. Что теперь?','Это ослабляет версию работодателя: падение связано с внешними факторами, а не с поведением работника.')}
${revealBox('t7-3','Факт 3: другие подразделения тоже не выполнили план. Что теперь?','Системность провала по всей организации указывает на объективные причины, а не на индивидуальное виновное поведение.')}
${revealBox('t7-4','Факт 4: обнаружено, что работник не совершал часть обязательных действий (не звонил клиентам по графику). Что теперь?','Появляется конкретное действие/бездействие — это уже потенциальная объективная сторона, при условии, что обязанность звонить по графику доказана.')}
${revealBox('t7-5','Факт 5: есть переписка, подтверждающая, что работник знал о графике и сознательно его не соблюдал. Что теперь?','Появляется субъективная сторона — умысел. Теперь состав проступка может считаться установленным по совокупности фактов 4 и 5, а не по факту 1 самому по себе.')}
${trainerTakeaway(7,"Общий результат (невыполненный план) и конкретное виновное действие — разные уровни анализа; состав появляется только тогда, когда они оба доказаны.")}`,
// 9. Откуда возникла обязанность?
()=>`<div class="kicker">Тренажёр 9 · Начальный</div><h2 class="section-title">Откуда возникла обязанность?</h2>
${trainerFabula("Распределите документы: доказывают ли они конкретную трудовую обязанность работника?")}
${bucketSorter('t8',[
  ["Трудовой договор","yes"],["Должностная инструкция, подписанная работником","yes"],["Коллективный договор","yes"],
  ["Приказ, с которым работник ознакомлен под подпись","yes"],["Правила внутреннего трудового распорядка","yes"],
  ["Сообщение в мессенджере без подтверждения прочтения","no"],["Устная просьба без свидетелей и документов","no"],
  ["Документ, с которым работника не ознакомили","no"],
],[{key:"yes",label:"Обязанность доказана"},{key:"no",label:"Не доказана обязанность"}])}
${trainerTakeaway(8,"Обязанность должна исходить из документа или акта, с которым работник был надлежащим образом ознакомлен — иначе её нарушение юридически недоказуемо.")}`,
// 10. Правильно сформулируйте иск
()=>`<div class="kicker">Тренажёр 10 · Начальный</div><h2 class="section-title">Правильно сформулируйте иск</h2>
${trainerFabula("По логике Умиржанова: у работника есть первое взыскание, второе взыскание, строгий выговор и приказ об увольнении. Выберите, какие требования нужно заявить в иске.")}
${multiSelectExercise('t9',[
  {text:"Признать незаконным приказ об увольнении",correct:true},
  {text:"Признать незаконным строгий выговор, предшествовавший увольнению",correct:true},
  {text:"Признать незаконными все предыдущие взыскания, если они также оспариваются по существу",correct:true},
  {text:"Заявить требование только о компенсации морального вреда, не оспаривая сами приказы",correct:false},
  {text:"Оставить без внимания приказы, напрямую не упомянутые в исковом заявлении",correct:false},
])}
${trainerTakeaway(9,"Суд разрешает спор в пределах заявленных требований — не оспоренный приказ сохраняет силу, даже если материально-правовая позиция работника сильна.")}`,
// 11. Несколько приказов за один день
()=>`<div class="kicker">Тренажёр 11 · Уверенный</div><h2 class="section-title">Несколько приказов за один день</h2>
${trainerFabula("По логике Абдуллаевой: в один день изданы четыре взыскания, затем — увольнение. Отметьте проблемы, которые нужно проверить.")}
${multiSelectExercise('t10',[
  {text:"Проблема повторности — непонятно, где новый проступок после предыдущего взыскания",correct:true},
  {text:"Проблема ознакомления работника с документами, легшими в основу взысканий",correct:true},
  {text:"Проблема доказательства самой трудовой обязанности (например, подлинности подписи под инструкцией)",correct:true},
  {text:"Проблема хронологии — одновременность взысканий, изданных в один день",correct:true},

])}
${trainerTakeaway(10,"Множественность приказов — не доказательство повторности; наоборот, она требует особенно тщательной проверки каждого элемента состава и процедуры.")}`,
// 12. Дисциплинарная процедура
()=>`<div class="kicker">Тренажёр 12 · Уверенный</div><h2 class="section-title">Дисциплинарная процедура</h2>
${trainerFabula("Расставьте этапы применения дисциплинарного взыскания в правильном порядке.")}
${rankingExercise('t11',["Обнаружение проступка","Требование письменного объяснения","Два рабочих дня на объяснение","Акт при отсутствии объяснения","Оценка обстоятельств","Приказ","Ознакомление работника"])}
${trainerTakeaway(11,"Пропуск любого этапа — даже при доказанном составе проступка — делает применение взыскания процедурно незаконным.")}`,
// 13. Дисциплинарные сроки
()=>`<div class="kicker">Тренажёр 13 · Уверенный</div><h2 class="section-title">Дисциплинарные сроки</h2>
${trainerFabula("Проступок совершён 3 месяца назад, обнаружен 20 дней назад. Работник был на больничном 10 дней из этого периода. Объяснение затребовано вчера.")}
${choiceListFull('t12',["Можно наложить взыскание сегодня","Нельзя — истёк месячный срок со дня обнаружения","Нужно подождать: ещё не истекли 2 рабочих дня на объяснение"],2,"Срок на предоставление объяснения (2 рабочих дня) ещё не истёк, а месячный срок со дня обнаружения (20 дней, за вычетом больничного) не нарушен. Взыскание пока не может быть наложено — нужно дождаться объяснения или акта об отказе его дать.")}
${trainerTakeaway(12,"Дисциплинарные сроки нужно проверять одновременно по нескольким точкам отсчёта: с момента совершения, с момента обнаружения и с момента затребования объяснения.")}`,
// 14. Повторность
()=>`<div class="kicker">Тренажёр 14 · Уверенный</div><h2 class="section-title">Повторность</h2>
${trainerFabula("По логике Ергазиной: расставьте события в последовательность, при которой повторность действительно возникает.")}
${rankingExercise('t13',["Первый проступок","Первое взыскание за первый проступок","Второй проступок, совершённый при ещё действующем взыскании","Увольнение за повторное нарушение"])}
${trainerTakeaway(13,"Повторность возникает только тогда, когда второй проступок совершён уже при действующем взыскании за первый — а не просто после него по времени.")}`,
// 15. Утрата доверия: ценности
()=>`<div class="kicker">Тренажёр 15 · Уверенный</div><h2 class="section-title">Утрата доверия: ценности</h2>
${trainerFabula("По логике Амантаевой: размер ущерба каждый раз разный, но внимание нужно обращать не только на цифру.")}
${choiceListFull('t14-1',["Старший кассир, недостача 500 000 тенге, виновные действия доказаны документально","Старший кассир, окончательный ущерб не установлен, но виновные действия с ценностями доказаны","Старший кассир, ущерба нет вообще, и виновных действий не выявлено"],1,"Утрата доверия строится на доказанных виновных действиях работника, непосредственно обслуживающего ценности, а не на точном размере ущерба.")}
${trainerTakeaway(14,"Факт ущерба — не главный элемент утраты доверия; главное — статус работника и доказанность его виновных действий с ценностями.")}`,
// 16. Утрата доверия: служебное положение
()=>`<div class="kicker">Тренажёр 16 · Уверенный</div><h2 class="section-title">Утрата доверия: служебное положение</h2>
${trainerFabula("По логике Телибаева: определите для каждой ситуации — обычный проступок, утрата доверия или недостаточно данных.")}
${bucketSorter('t15',[
  ["Руководитель отдела закупок организует закупку у компании собственного родственника без раскрытия конфликта интересов","trust"],
  ["Работник опоздал на работу на 20 минут","ordinary"],
  ["Начальник участка направляет подчинённых на работы на собственном частном объекте под видом служебного задания","trust"],
  ["Сотрудник отдела кадров нарушил срок уведомления о приказе","ordinary"],
  ["Поступила анонимная жалоба на сотрудника без каких-либо документов","unclear"],
],[{key:"trust",label:"Утрата доверия"},{key:"ordinary",label:"Обычный проступок"},{key:"unclear",label:"Недостаточно данных"}])}
${trainerTakeaway(15,"Утрата доверия по модели служебного положения требует доказанного использования полномочий вопреки интересам работодателя, а не любого нарушения трудовой дисциплины.")}`,
// 17. Внутреннее расследование
()=>`<div class="kicker">Тренажёр 17 · Уверенный</div><h2 class="section-title">Внутреннее расследование</h2>

// 18. Какое дисциплинарное основание?
()=>`<div class="kicker">Тренажёр 18 · Уверенный</div><h2 class="section-title">Какое дисциплинарное основание?</h2>

${revealBox('t17-2','Опьянение — что доказать?','Факт нахождения на работе в состоянии алкогольного, наркотического или токсикоманического опьянения, как правило — результатами медицинского освидетельствования или иными допустимыми доказательствами.')}
${revealBox('t17-3','Отказ от освидетельствования — что доказать?','Надлежащее направление на освидетельствование и сам факт отказа — отдельно от факта употребления.')}
${revealBox('t17-4','Нарушение требований безопасности — что доказать?','Конкретное нарушение правил безопасности и то, что оно повлекло тяжкие последствия либо создало реальную угрозу таких последствий.')}
${revealBox('t17-5','Повторность — что доказать?','Новый проступок, совершённый при уже действующем дисциплинарном взыскании за предыдущий.')}
${revealBox('t17-6','Ложные документы — что доказать?','Факт предоставления заведомо ложных документов или сведений, имевших значение для заключения трудового договора или исполнения обязанностей.')}
${trainerTakeaway(17,"Каждое специальное дисциплинарное основание имеет собственный, отличный от других, перечень юридически значимых фактов.")}`,
// 19. Пиво или отказ?
()=>`<div class="kicker">Тренажёр 19 · Уверенный</div><h2 class="section-title">Пиво или отказ?</h2>

${revealBox('t18-2','Раунд 2: прибор работодателя показал наличие алкоголя. Меняется ли ответ?','Это может быть основанием для освидетельствования, но не автоматическим основанием для увольнения за «опьянение на работе» без надлежащей процедуры.')}
${revealBox('t18-3','Раунд 3: направление на медицинское освидетельствование оформлено ненадлежащим образом, не зарегистрировано. Меняется ли ответ?','Да — без надлежащего направления невозможно доказать ни факт опьянения по этому каналу, ни факт отказа от освидетельствования.')}
${revealBox('t18-4','Раунд 4: имеется акт об отказе работника от освидетельствования. Достаточно ли этого?','Акт об отказе значим только в связке с надлежащим направлением — его одного недостаточно, если направление оформлено с нарушениями.')}

// 20. Сокращение: процедура
()=>`<div class="kicker">Тренажёр 20 · Уверенный</div><h2 class="section-title">Сокращение: процедура</h2>

${trainerTakeaway(19,"Пропуск организационного решения или уведомления в начале цепочки ставит под сомнение весь последующий порядок сокращения.")}`,
// 21. Настоящее сокращение?
()=>`<div class="kicker">Тренажёр 21 · Уверенный</div><h2 class="section-title">Настоящее сокращение?</h2>
${trainerFabula("По логике Сактаганова: должность «менеджер» заменяется на «системный администратор». Факты добавляются постепенно.")}

${revealBox('t20-2','Факт 2: добавлены новые обязанности по автоматизации и новые квалификационные требования (сертификация по IT). Меняется ли вывод?','Это сдвигает оценку в сторону реального сокращения/перевода на принципиально другую функцию, а не просто переименования.')}
${revealBox('t20-3','Факт 3: обязанности совпадают с прежними на 80%, новые требования почти не применяются на практике. Меняется ли вывод?','Это сдвигает оценку обратно в сторону переименования — функция по существу сохранилась.')}
${revealBox('t20-4','Факт 4: обнаружено, что на фактически прежнюю работу принят новый работник под новым названием должности. Меняется ли вывод?','Это сильный признак фиктивности сокращения — работа не исчезла, а просто передана другому человеку под новым названием должности.')}
${trainerTakeaway(20,"Реальность сокращения оценивается по совокупности всех признаков одновременно, а не по одному изменению названия должности.")}`,
// 22. Снижение объёма работ

// 23. Квалификация или дисциплина?
()=>`<div class="kicker">Тренажёр 23 · Продвинутый</div><h2 class="section-title">Квалификация или дисциплина?</h2>

// 24. Законна ли аттестация?

// 25. Корпоративная оценка = аттестация?
()=>`<div class="kicker">Тренажёр 25 · Продвинутый</div><h2 class="section-title">Корпоративная оценка = аттестация?</h2>

    <div class="kicker">AI-критика</div>
    <h2 class="section-title">Проверь ответ искусственного интеллекта</h2>
    <div class="tab-row">${AI_MISTAKES.map((x,i)=>`<button class="navbtn ${n===i?'active':''}" onclick="setAICritLesson(${i})">${x.lesson}</button>`).join("")}</div>
    <div class="card navy" style="margin-bottom:18px;"><p style="color:#fff;font-size:13.5px;">«${m.claim}»</p></div>
    <label class="q">1. Какую ошибку вы нашли?</label>${answerBox('aicrit-'+n+'-error')}
    <label class="q">2. Какой элемент пропущен?</label>${answerBox('aicrit-'+n+'-missing')}
    <label class="q">3. Исправьте вывод</label>${answerBox('aicrit-'+n+'-fixed')}
    ${revealBox(openKey,'Сверьтесь с правовым выводом', `<p><b>Пропущенный элемент:</b> ${m.missing}</p><div class="card burgundy" style="margin-top:10px;"><p style="color:#fff;">${m.fixed}</p></div>`)}
  </div>`;
}
window.setAICritLesson=function(i){ state.aicritLesson=i; save(); render(); };
function screenMap(){
  return `<div class="wrap narrow">
    <div class="kicker">Финальная карта понимания</div>
    <h2 class="section-title">Увольнение — это не один юридический факт</h2>
    ${verticalFlow(["Основание","Юридические факты","Правильная квалификация","Процедура","Гарантии","Доказательства"],{final:"Правовое последствие"})}
    <div class="quote-slide" style="margin-top:22px;padding:28px 22px;"><blockquote style="font-size:clamp(14px,1.9vw,17px);">«Это юридический состав». «Основание есть» ≠ «увольнение законно».</blockquote></div>
    <div class="card" style="margin-top:22px;text-align:center;"><p class="q" style="font-weight:700;color:var(--navy);font-size:15px;margin:0;">«Может ли работодатель быть прав по существу — и всё равно незаконно уволить работника?»</p></div>
    <div style="text-align:center;margin-top:30px;"><button class="btn btn-red" onclick="goTo('after')">К самостоятельной работе →</button></div>
  </div>`;
}
function screenAfter(){
  return `<div class="wrap">
    <div class="kicker">Самостоятельная работа</div>
    <h2 class="section-title">После темы</h2>
    <p class="lede" style="margin-bottom:22px;">Материалы для самостоятельного закрепления темы.</p>
    <div class="grid cols-2" style="margin-bottom:18px;">
      <div class="card"><h3>1. Повторить</h3><p>Прекращение, расторжение, увольнение · систему оснований прекращения · соглашение сторон · инициативу работника · инициативу работодателя · состав дисциплинарного проступка (субъект, объект, объективная и субъективная сторона) · дисциплинарную процедуру и сроки · повторность · утрату доверия в двух моделях · специальные дисциплинарные основания · экономические основания (ликвидация, сокращение, снижение объёма работ) · недостаточную квалификацию и аттестацию · медико-биологические основания и пенсионный возраст · иные основания прекращения · отстранение от работы.</p></div>
      <div class="card"><h3>2. Судебный анализ</h3><p>Выберите одно из 16 дел и заполните таблицу: факты, позиция работника, позиция работодателя, правовой вопрос, доказательства, решение, правовой вывод.</p></div>
      <div class="card"><h3>3. Сравнить</h3><p>Соглашение сторон / инициатива работника / инициатива работодателя / обстоятельства вне воли сторон — по критериям: нужна ли вина, нужна ли процедура, чьё волеизъявление решающее.</p></div>
      <div class="card"><h3>4. Кашаев и Джексенбаева</h3><p>Объясните, почему похожие по теме дела о пенсионном возрасте привели к разным судебным выводам.</p></div>
      <div class="card"><h3>5. Состав проступка</h3><p>Возьмите любой известный вам реальный случай дисциплинарного взыскания и разложите его на субъект, объект, объективную и субъективную стороны.</p></div>
      <div class="card"><h3>6. Drafting</h3><p>Перепишите формулировку приказа «Уволить за нарушение трудовой дисциплины» так, чтобы она содержала конкретное описание факта, обязанности и вины.</p></div>
      <div class="card"><h3>7. Аудит процедуры</h3><p>Найдите минимум 10 процедурных рисков в предложенном преподавателем проекте приказа об увольнении (см. Тренажёр 36).</p></div>
      <div class="card"><h3>8. AI-задание</h3><p>Спросите ИИ: «Когда работодателя в Казахстане вправе уволить работника за нарушение трудовой дисциплины?» Проверьте, разграничил ли ИИ состав проступка, процедуру, повторность и специальные основания, или свёл ответ к одному признаку.</p></div>
    </div>
    ${qrZone("canvas8","Материалы курса в Canvas LMS","https://canvas.instructure.com")}
    <div style="margin-top:16px;">${qrZone("tkrk8","Ссылка на Трудовой кодекс РК","https://")}</div>
    <div style="text-align:center;margin-top:26px;">
      <button class="btn btn-navy" onclick="exportAnswers()">Отправить ответы преподавателю (скачать файл)</button>
      <span class="note" id="export-status" style="display:block;margin-top:8px;"></span>
    </div>
    <div style="text-align:center;margin-top:16px;"><button class="btn btn-outline" style="color:var(--navy);border-color:var(--navy);" onclick="goTo('cover')">Вернуться на главный экран</button></div>
  </div>`;
}
window.exportAnswers=async function(){
  const status=document.getElementById('export-status');
  try{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='tema8-otvety.json'; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    if(status) status.textContent='Файл с ответами скачан.';
  }catch(e){ if(status) status.textContent='Не удалось сформировать файл.'; }
};

/* ============================================================
   СОСТОЯНИЕ И НАВИГАЦИЯ
   ============================================================ */
const state = load() || {slide:0, stage:{}, answers:{}, reveals:{}, sorters:{}, rankings:{}, rankChecked:{}, multiSel:{}, multiSelChecked:{}, refl:{}, currentCase:null, teacherMode:true, casesTab:'list', trainersTab:'grid', aicritLesson:0};
if(!state.sorters) state.sorters={};
if(!state.rankings) state.rankings={};
if(!state.rankChecked) state.rankChecked={};
if(!state.multiSel) state.multiSel={};
if(!state.multiSelChecked) state.multiSelChecked={};
if(!state.refl) state.refl={};
if(state.teacherMode===undefined) state.teacherMode=true;
if(!state.casesTab) state.casesTab='list';
if(!state.trainersTab) state.trainersTab='grid';
if(state.aicritLesson===undefined) state.aicritLesson=0;
function save(){try{localStorage.setItem('mnu_labor_law_topic8',JSON.stringify(state));}catch(e){}}
function load(){try{const s=localStorage.getItem('mnu_labor_law_topic8');return s?JSON.parse(s):null;}catch(e){return null;}}

let currentScreen='cover';
let currentTrainer=null;

function goTo(screen){ currentScreen=screen; currentTrainer=null; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function openTrainer(i){ currentScreen='trainers'; currentTrainer=i; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function openCase(i){ currentScreen='cases'; state.currentCase=i; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function goTo81(){ currentScreen='presentation'; currentTrainer=null; goSlide(6,'full'); }
function goTo82(){ currentScreen='presentation'; currentTrainer=null; goSlide(38,'full'); }
function goTo83(){ currentScreen='presentation'; currentTrainer=null; goSlide(62,'full'); }
function goTo84(){ currentScreen='presentation'; currentTrainer=null; goSlide(81,'full'); }
window.toggleMode=function(){ state.teacherMode=!state.teacherMode; save(); render(); };

function goSlide(i, revealMode){
  state.slide = Math.max(0, Math.min(SLIDES.length-1, i));
  const s = SLIDES[state.slide];
  if(revealMode==='full') state.stage[state.slide] = s.maxStep||0;
  else if(revealMode==='reset') state.stage[state.slide] = 0;
  save(); render(); window.scrollTo({top:0,behavior:'smooth'});
}
function advanceSlide(){
  const i=state.slide, s=SLIDES[i], max=s.maxStep||0, cur=state.stage[i]||0;
  if(cur<max){ state.stage[i]=cur+1; save(); render(); return; }
  if(i<SLIDES.length-1) goSlide(i+1,'reset'); else render();
}
function backSlide(){
  const i=state.slide, cur=state.stage[i]||0;
  if(cur>0){ state.stage[i]=cur-1; save(); render(); return; }
  if(i>0) goSlide(i-1,'full');
}
document.addEventListener('keydown', (e)=>{
  if(currentScreen!=='presentation') return;
  if(['ArrowRight','PageDown',' ','Spacebar'].includes(e.key)){ e.preventDefault(); advanceSlide(); }
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); backSlide(); }
});

function renderQr(id){
  const url = document.getElementById(`qrurl-${id}`).value.trim();
  const box = document.getElementById(`qrbox-${id}`);
  if(!box) return;
  box.innerHTML='';
  if(!url){ box.innerHTML='<span style="font-size:10px;color:#999;">QR</span>'; return; }
  if(typeof QRCode==='undefined'){ box.innerHTML='<span style="font-size:9px;color:#c8102e;padding:4px;text-align:center;">Библиотека QR не загрузилась</span>'; return; }
  try{ new QRCode(box, {text:url, width:88, height:88, colorDark:"#0c2340", colorLight:"#ffffff"}); }
  catch(e){ box.innerHTML='<span style="font-size:9px;color:#c8102e;">ошибка</span>'; }
}

function render(){
  const app=document.getElementById('app');
  let html='';
  switch(currentScreen){
    case 'cover': html=screenCover(); break;
    case 'roadmap': html=screenRoadmap(); break;
    case 'presentation': html=screenPresentation(); break;
    case 'trainers': html=screenTrainers(); break;
    case 'cases': html=screenCases(); break;
    case 'aicrit': html=screenAICrit(); break;
    case 'map': html=screenMap(); break;
    case 'after': html=screenAfter(); break;
    default: html=screenCover();
  }
  app.innerHTML = `<div class="screen active">${html}</div>`;
  updateProgress();
  autoRenderQrZones();
  const mb=document.getElementById('modeToggleBtn');
  if(mb){ mb.textContent = state.teacherMode ? 'Режим преподавателя' : 'Режим студента'; mb.className = 'mode-toggle'+(state.teacherMode?'':' student'); }
}
function updateProgress(){
  const order=['cover','roadmap','presentation','trainers','cases','aicrit','map','after'];
  let pct=0;
  if(currentScreen==='presentation'){ pct = 8 + (state.slide/(SLIDES.length-1))*55; }
  else{ const idx=order.indexOf(currentScreen); pct = [3,6,8,70,78,88,95,100][idx] ?? 0; }
  document.getElementById('progressFill').style.width=pct+'%';
}
render();
</script>
