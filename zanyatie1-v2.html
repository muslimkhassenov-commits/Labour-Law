<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Трудовое право РК — Занятие №1. Миссия трудового права</title>
<meta name="description" content="Интерактивный образовательный модуль MNU: презентация, тренажёры юридического мышления и лендинг для занятия «Миссия трудового права»." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --navy:#0c2340;
  --navy-2:#123058;
  --graphite:#2b2e33;
  --graphite-soft:#585c63;
  --burgundy:#7c1327;
  --red:#c8102e;
  --red-soft:#e3d2d5;
  --paper:#f7f5f1;
  --paper-2:#efece5;
  --white:#ffffff;
  --line:#dfdbd2;
  --ok:#1f6f43;
  --shadow:0 12px 30px -14px rgba(12,35,64,.28);
  --radius:18px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Inter',system-ui,sans-serif;
  background:var(--paper);
  color:var(--graphite);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#c9c3b6;border-radius:6px;}
a{color:inherit;}
button{font-family:inherit;}
img{max-width:100%;}

/* ---------- layout shells ---------- */
.screen{display:none;min-height:100vh;}
.screen.active{display:block;animation:fade .35s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(247,245,241,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;
  padding:10px 20px;
}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);white-space:nowrap;cursor:pointer;}
.topbar .brand .logo-wrap{width:34px;height:34px;}
.topbar .nav-scroll{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px 0;}
.topbar .nav-scroll::-webkit-scrollbar{height:6px;}
.navbtn{
  border:1px solid var(--line);background:var(--white);color:var(--navy);
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:.15s;
}
.navbtn:hover{border-color:var(--navy);}
.navbtn.primary{background:var(--red);border-color:var(--red);color:#fff;}
.navbtn.primary:hover{background:#a70d26;}
.navbtn.ghost{background:transparent;}
.progress-rail{height:4px;background:var(--line);width:100%;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--burgundy),var(--red));transition:width .3s;}

.wrap{max-width:1080px;margin:0 auto;padding:48px 24px 80px;}
.wrap.narrow{max-width:820px;}
.kicker{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--burgundy);font-weight:700;margin-bottom:14px;
}
.kicker::before{content:"";width:22px;height:2px;background:var(--red);display:inline-block;}
h1.page-title{font-size:clamp(28px,4vw,44px);line-height:1.1;color:var(--navy);margin:0 0 12px;}
h2.section-title{font-size:clamp(22px,3vw,30px);color:var(--navy);margin:0 0 10px;line-height:1.18;}
.subtitle{font-size:17px;color:var(--graphite-soft);max-width:680px;line-height:1.6;}
.lede{font-size:15px;color:var(--graphite-soft);line-height:1.7;max-width:720px;}

/* ---------- logo / photo placeholders ---------- */
.logo-wrap{position:relative;display:inline-block;}
.logo-wrap img{display:block;width:100%;height:100%;object-fit:contain;}
.logo-fallback{display:none;width:100%;height:100%;}
.logo-fallback svg{display:block;width:100%;height:100%;}
.logo-wrap img.err{display:none;}
.logo-wrap img.err + .logo-fallback{display:block;}

.hero-photo-wrap{
  position:relative;border-radius:var(--radius);overflow:hidden;
  background:linear-gradient(180deg,#2a4d7a 0%,#0c2340 55%,#081527 100%);
  min-height:340px;
}
.hero-photo-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.hero-photo-wrap img.err{display:none;}
.hero-photo-fallback{position:absolute;inset:0;display:none;}
.hero-photo-wrap img.err + .hero-photo-fallback{display:block;}
.hero-photo-fallback svg{width:100%;height:100%;}

/* ---------- cover ---------- */
.cover{
  background:var(--navy);
  color:#fff;
  position:relative;
  overflow:hidden;
}
.cover::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,rgba(12,35,64,.94),rgba(12,35,64,.72) 55%,rgba(124,19,39,.55));
  z-index:1;
}
.cover .hero-photo-wrap{position:absolute;inset:0;border-radius:0;min-height:0;}
.cover-inner{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:64px 24px 72px;text-align:left;}
.cover-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:64px;}
.cover-top .univ-name{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;}
.cover .logo-wrap{width:56px;height:56px;}
.cover-eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#f2c9c9;font-weight:700;margin-bottom:18px;}
.cover h1{font-size:clamp(34px,5.5vw,58px);line-height:1.06;margin:0 0 16px;}
.cover .cover-sub{font-size:clamp(17px,2.2vw,22px);font-weight:600;color:#dfe6ef;margin:0 0 22px;}
.cover .cover-question{
  font-size:16px;line-height:1.6;max-width:640px;color:#c9d3e0;
  border-left:3px solid var(--red);padding-left:16px;margin-bottom:36px;
}
.cover-actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:40px;}
.btn{
  border:none;border-radius:10px;padding:13px 22px;font-weight:700;font-size:14.5px;
  cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px;
}
.btn-red{background:var(--red);color:#fff;}
.btn-red:hover{background:#a70d26;transform:translateY(-1px);}
.btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55);}
.btn-outline:hover{border-color:#fff;}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{background:var(--navy-2);}
.cover-author{
  display:flex;gap:12px;align-items:center;color:#c9d3e0;font-size:13.5px;
  border-top:1px solid rgba(255,255,255,.18);padding-top:20px;max-width:520px;
}
.cover-author b{color:#fff;display:block;font-size:14.5px;}

/* ---------- cards / grids ---------- */
.grid{display:grid;gap:18px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:820px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

.card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow);
}
.card h3{margin:0 0 8px;color:var(--navy);font-size:17px;}
.card p{margin:0;font-size:14px;color:var(--graphite-soft);line-height:1.6;}
.card.accent-left{border-left:4px solid var(--red);}
.card.navy{background:var(--navy);color:#fff;border-color:var(--navy);}
.card.navy h3{color:#fff;}
.card.navy p{color:#c9d3e0;}
.card.burgundy{background:var(--burgundy);color:#fff;border-color:var(--burgundy);}
.card.burgundy p{color:#ecd8dc;}

.stat-card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 20px;text-align:center;box-shadow:var(--shadow);
}
.stat-card .num{font-family:'Fraunces',serif;font-size:clamp(28px,4vw,40px);color:var(--red);font-weight:700;line-height:1;}
.stat-card .lbl{margin-top:8px;font-size:13.5px;color:var(--graphite-soft);}

/* ---------- roadmap / timeline ---------- */
.roadmap{display:flex;flex-wrap:wrap;gap:0;align-items:stretch;}
.roadmap .node{
  flex:1 1 150px;background:var(--white);border:1px solid var(--line);border-radius:14px;
  padding:16px 14px;text-align:center;font-size:13px;font-weight:600;color:var(--navy);
  position:relative;box-shadow:var(--shadow);
}
.roadmap .arrow{display:flex;align-items:center;justify-content:center;color:var(--red);font-size:20px;flex:0 0 32px;}
@media (max-width:760px){.roadmap{flex-direction:column;}.roadmap .arrow{transform:rotate(90deg);}}

.timeline{position:relative;padding-left:28px;}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line);}
.timeline-step{position:relative;padding-bottom:26px;}
.timeline-step::before{
  content:attr(data-n);position:absolute;left:-28px;top:0;width:20px;height:20px;border-radius:50%;
  background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.timeline-step h4{margin:0 0 4px;color:var(--navy);font-size:15px;}
.timeline-step p{margin:0;font-size:13.5px;color:var(--graphite-soft);}

/* ---------- fork / branches ---------- */
.fork{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:700px){.fork{grid-template-columns:1fr;}}
.branch{border-radius:var(--radius);padding:22px;border:1.5px solid var(--line);}
.branch.left{background:#f2f1ec;}
.branch.right{background:#fff5f2;border-color:#f0c9c4;}
.branch h4{margin:0 0 10px;color:var(--navy);}
.branch ul{margin:0;padding-left:18px;font-size:14px;color:var(--graphite-soft);line-height:1.7;}

/* ---------- scale (весы) ---------- */
.scale-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0;}
.scale-cap{font-size:13px;color:var(--graphite-soft);max-width:520px;text-align:center;}

/* ---------- ship ---------- */
.ship-labels{display:flex;justify-content:space-between;gap:24px;margin-top:14px;flex-wrap:wrap;}
.ship-col{flex:1 1 220px;}
.ship-col h4{margin:0 0 8px;font-size:14px;color:var(--navy);}
.ship-col ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--graphite-soft);line-height:1.7;}

/* ---------- quote ---------- */
.quote-slide{
  background:var(--navy);color:#fff;border-radius:var(--radius);padding:56px 48px;text-align:center;
  position:relative;overflow:hidden;
}
.quote-slide::before{content:"\201C";position:absolute;top:-10px;left:24px;font-family:'Fraunces',serif;font-size:160px;color:rgba(200,16,46,.35);line-height:1;}
.quote-slide blockquote{margin:0 auto 18px;max-width:680px;font-family:'Fraunces',serif;font-size:clamp(20px,3vw,28px);line-height:1.4;position:relative;z-index:1;}
.quote-slide cite{font-style:normal;color:#e3b9c1;font-size:14px;letter-spacing:.05em;}

/* ---------- video placeholder ---------- */
.video-box{
  border:2px dashed #b9b2a1;border-radius:var(--radius);background:#efece3;
  padding:50px 20px;text-align:center;color:var(--graphite-soft);
}
.video-box .play{
  width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:20px;
}
.video-box b{display:block;color:var(--navy);font-size:15px;margin-bottom:4px;}

/* ---------- qr zone ---------- */
.qr-zone{
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  border:1.5px dashed #c7bfae;border-radius:14px;padding:16px;background:#fbfaf7;
}
.qr-box{width:96px;height:96px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;}
.qr-box canvas,.qr-box img{width:100%;height:100%;}
.qr-meta{flex:1;min-width:180px;}
.qr-meta b{display:block;font-size:14px;color:var(--navy);margin-bottom:6px;}
.qr-meta input{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px;
}
.qr-meta button{
  border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;
  padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
}

/* ---------- slide shell ---------- */
.slide-shell{background:var(--white);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:40px clamp(22px,5vw,56px);min-height:520px;}
.slide-meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--graphite-soft);margin-bottom:18px;}
.slide-controls{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:10px;}
.dot-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:420px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;}
.dot.active{background:var(--red);width:18px;border-radius:4px;}

/* ---------- choice list ---------- */
.choice{
  display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;
  border-radius:12px;padding:13px 16px;margin-bottom:10px;cursor:pointer;font-size:14.5px;color:var(--graphite);
  transition:.15s;
}
.choice:hover{border-color:var(--navy);}
.choice.selected{border-color:var(--navy);background:#eef2f7;}
.choice.correct{border-color:var(--ok);background:#e9f5ee;}
.choice.wrong{border-color:var(--red);background:#fbeceb;}
.choice b{color:var(--navy);margin-right:6px;}

.explain-box{
  margin-top:14px;border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.6;
}
.explain-box.ok{background:#e9f5ee;color:#1c5f3a;}
.explain-box.no{background:#fbeceb;color:#8c2a26;}

/* ---------- trainer cards ---------- */
.trainer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media (max-width:900px){.trainer-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:620px){.trainer-grid{grid-template-columns:1fr;}}
.trainer-card{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;cursor:pointer;
  box-shadow:var(--shadow);transition:.18s;display:flex;flex-direction:column;gap:10px;
}
.trainer-card:hover{transform:translateY(-3px);border-color:var(--navy);}
.trainer-card .n{font-family:'Fraunces',serif;font-size:26px;color:var(--red);font-weight:700;}
.trainer-card h3{margin:0;color:var(--navy);font-size:16.5px;}
.trainer-card p{margin:0;font-size:13px;color:var(--graphite-soft);flex:1;}
.trainer-card .tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--burgundy);font-weight:700;}

/* ---------- sorting buckets ---------- */
.sort-layout{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media (max-width:760px){.sort-layout{grid-template-columns:1fr;}}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;}
.chip{
  border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;
  cursor:pointer;color:var(--graphite);transition:.15s;
}
.chip:hover{border-color:var(--navy);}
.bucket{
  border:1.5px dashed #c7bfae;border-radius:14px;padding:14px;min-height:120px;background:#fbfaf7;
}
.bucket h4{margin:0 0 10px;font-size:14px;color:var(--navy);}
.bucket.wrong-drop{border-color:var(--red);}

/* ---------- textarea ---------- */
textarea.answer{
  width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;
  font-family:inherit;min-height:80px;resize:vertical;
}
label.q{display:block;font-size:14px;font-weight:600;color:var(--navy);margin:16px 0 6px;}

/* ---------- final map ---------- */
.map-flow{display:flex;flex-direction:column;align-items:center;gap:0;}
.map-node{
  background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 22px;
  font-weight:600;color:var(--navy);text-align:center;box-shadow:var(--shadow);max-width:520px;width:100%;
}
.map-node.final{background:var(--navy);color:#fff;border-color:var(--navy);font-family:'Fraunces',serif;font-size:17px;}
.map-arrow{color:var(--red);font-size:22px;line-height:1;padding:4px 0;}

/* ---------- footer ---------- */
.site-footer{border-top:1px solid var(--line);padding:28px 24px;text-align:center;font-size:12.5px;color:var(--graphite-soft);}

.pill{display:inline-block;background:#eef2f7;color:var(--navy);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;margin-right:6px;}
.note{font-size:12.5px;color:var(--graphite-soft);font-style:italic;margin-top:10px;}
hr.sep{border:none;border-top:1px solid var(--line);margin:26px 0;}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand" onclick="goTo('cover')">
    <span class="logo-wrap"><img src="assets/mnu-logo.png" onerror="this.classList.add('err')"><span class="logo-fallback"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="6" fill="#c8102e"/><text x="32" y="30" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="700" font-size="22" fill="#fff">MNU</text><path d="M18 46 L32 37 L46 46 Z" fill="none" stroke="#fff" stroke-width="2.5"/><rect x="16" y="46" width="4" height="8" fill="#fff"/><rect x="24" y="46" width="4" height="8" fill="#fff"/><rect x="32" y="46" width="4" height="8" fill="#fff"/><rect x="40" y="46" width="4" height="8" fill="#fff"/><rect x="14" y="54" width="36" height="3" fill="#fff"/></svg></span></span>
    <span>Трудовое право РК</span>
  </div>
  <div class="nav-scroll">
    <button class="navbtn" onclick="goTo('cover')">Главная</button>
    <button class="navbtn" onclick="goTo('roadmap')">Логика занятия</button>
    <button class="navbtn primary" onclick="goTo('presentation')">К презентации</button>
    <button class="navbtn" onclick="goTo('trainers')">К тренажёрам</button>
    <button class="navbtn" onclick="goTo('map')">Карта понимания</button>
    <button class="navbtn" onclick="goTo('after')">После занятия</button>
    <button class="navbtn ghost" onclick="openTrainer(6)">Финальная рефлексия</button>
  </div>
</div>
<div class="progress-rail"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<div id="app"></div>

<div class="site-footer">
  Maqsut Narikbayev University · Курс «Трудовое право Республики Казахстан» · Хасенов Муслим Ханатович, PhD, Associate Professor
</div>

<script>
/* ============================================================
   ДАННЫЕ ЗАНЯТИЯ — весь контент вынесен сюда, логика ниже не трогается
   ============================================================ */

const ROADMAP_NODES = ["Рынок труда","Труд как материальная категория","Труд и капитал","Прибавочная стоимость","Наёмный труд","Миссия трудового права","История","Платформенная занятость","Финальная рефлексия"];

const SLIDES = [
// 1
{kicker:"Титульный слайд", render:()=>`
  <div style="text-align:center;padding:30px 0;">
    <div class="logo-wrap" style="width:64px;height:64px;margin:0 auto 22px;"><img src="assets/mnu-logo.png" onerror="this.classList.add('err')"><span class="logo-fallback">${logoSVG()}</span></div>
    <div class="kicker" style="justify-content:center;">Занятие №1</div>
    <h1 class="page-title" style="text-align:center;margin:0 auto 10px;">Трудовое право Республики Казахстан</h1>
    <p class="subtitle" style="margin:0 auto 20px;text-align:center;">Миссия трудового права</p>
    <p class="lede" style="margin:0 auto;text-align:center;font-style:italic;">Формальная свобода договора и фактическое неравенство сторон</p>
    ${scaleSVG(58,42)}
  </div>`},
// 2
{kicker:"Мысленный эксперимент", render:()=>`
  <h2 class="section-title">Мир без трудового права</h2>
  <p class="lede">Если есть только свобода договора, будет ли этого достаточно?</p>
  ${videoBox("«Мир, в котором нет трудового права»","Посмотрите ролик и ответьте: какие гарантии исчезают первыми?")}`},
// 3
{kicker:"Обсуждение", render:()=>`
  <h2 class="section-title">Обсуждение после ролика</h2>
  ${numList(["Что исчезло первым?","Почему работник оказался уязвим?","Кто в таком мире сильнее — работник или работодатель?","Зачем государству вмешиваться в трудовые отношения?"])}`},
// 4
{kicker:"Рынок труда", render:()=>`

  const ex=document.getElementById(`explain-${id}`);
  if(ex){ex.style.display='block';}
};

  currentScreen='trainers'; currentTrainer=i;

function renderQr(id){
  const url = document.getElementById(`qrurl-${id}`).value.trim();
  const box = document.getElementById(`qrbox-${id}`);
  if(!box) return;
  box.innerHTML='';
  if(!url){ box.innerHTML='<span style="font-size:10px;color:#999;">QR</span>'; return; }
  if(typeof QRCode==='undefined'){ box.innerHTML='<span style="font-size:9px;color:#c8102e;padding:4px;text-align:center;">Библиотека QR не загрузилась</span>'; return; }
  try{ new QRCode(box, {text:url, width:96, height:96, colorDark:"#0c2340", colorLight:"#ffffff"}); }
  catch(e){ box.innerHTML='<span style="font-size:9px;color:#c8102e;">ошибка</span>'; }
}

window.exportAnswers=function(){
  let out = "ОТВЕТЫ СТУДЕНТА — Занятие №1. Миссия трудового права\n";

  ["t5-q1","t5-q2","t5-q3","t5-q4","t5-q5"].forEach(id=>{out += (state.refl7[id]||"(нет ответа)")+"\n";});
  out += "\n— Тренажёр 7 (финальная рефлексия) —\n";
  ["r1","r2","r3","r4","r5"].forEach(id=>{out += (state.refl7[id]||"(нет ответа)")+"\n";});
  const blob = new Blob([out], {type:"text/plain;charset=utf-8"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "otvety-zanyatie1-trudovoe-pravo.txt";

};

/* ============================================================

   ============================================================ */
function render(){
  const app = document.getElementById('app');
  let html='';
  switch(currentScreen){
    case 'cover': html=screenCover(); break;
    case 'roadmap': html=screenRoadmap(); break;
    case 'presentation': html=screenPresentation(); break;
    case 'trainers': html=screenTrainers(); break;
    case 'map': html=screenMap(); break;
    case 'after': html=screenAfter(); break;
    default: html=screenCover();
  }
  app.innerHTML = `<div class="screen active">${html}</div>`;
  updateProgress();
}
function updateProgress(){
  const order=['cover','roadmap','presentation','trainers','map','after'];
  let pct=0;
  if(currentScreen==='presentation'){
    pct = 15 + (state.slide/(SLIDES.length-1))*55;
  } else {
    const idx=order.indexOf(currentScreen);
    pct = [3,10,15,78,90,100][idx] ?? 0;
  }
  document.getElementById('progressFill').style.width=pct+'%';
}

render();
