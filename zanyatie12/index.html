.timeline{position:relative;padding-left:28px;}

.qr-box{width:88px;height:88px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;}

.qr-meta input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;margin-bottom:6px;}

.dot-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:460px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);cursor:pointer;}
.dot.active{background:var(--red);width:16px;border-radius:4px;}

.choice{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 15px;margin-bottom:9px;cursor:pointer;font-size:14px;color:var(--graphite);transition:.15s;}

.explain-box{margin-top:12px;border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.6;}

.sort-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;}

function logoSVG(){return `<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="6" fill="#c8102e"/><text x="32" y="30" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="700" font-size="22" fill="#fff">MNU</text><path d="M18 46 L32 37 L46 46 Z" fill="none" stroke="#fff" stroke-width="2.5"/><rect x="16" y="46" width="4" height="8" fill="#fff"/><rect x="24" y="46" width="4" height="8" fill="#fff"/><rect x="32" y="46" width="4" height="8" fill="#fff"/><rect x="40" y="46" width="4" height="8" fill="#fff"/><rect x="14" y="54" width="36" height="3" fill="#fff"/></svg>`;}
function campusSVG(){
  return `<svg viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;">
    <rect width="800" height="400" fill="#0c2340"/><rect width="800" height="400" fill="url(#g)"/>
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123058"/><stop offset="1" stop-color="#081527"/></linearGradient></defs>

function bucketSorter(sortKey, items, buckets){
  const placed = state.sorters[sortKey]||{};
  const pool = items.filter(([txt])=>!(txt in placed));
  const cols = Math.min(buckets.length,4);
  return `
  <div class="pool" style="margin-bottom:14px;">${pool.map(([txt,correct])=>`
    <span class="chip">${txt}
      ${buckets.map(b=>`<button onclick="sortPick('${sortKey}','${txt.replace(/'/g,"\\'")}','${b.key}',${b.key===correct})">→${b.label.split(' ')[0]}</button>`).join("")}
    </span>`).join("")||'<span class="note">Все карточки распределены.</span>'}</div>
  <div class="sort-layout ${cols===3?'cols-3':cols===4?'cols-4':cols>=5?'cols-5':''}">
    ${buckets.map(b=>`<div class="bucket"><h4>${b.label}</h4>${Object.entries(placed).filter(([,v])=>v.bucket===b.key).map(([txt,v])=>`<span class="chip" style="border-color:${v.ok?'#1f6f43':'#c8102e'};" onclick="unSort('${sortKey}','${txt.replace(/'/g,"\\'")}')">${v.ok?'✓':'✕'} ${txt}</span>`).join("")}</div>`).join("")}
  </div>`;
}
window.sortPick=function(sortKey,item,bucketKey,isCorrect){
  if(!state.sorters[sortKey]) state.sorters[sortKey]={};
  state.sorters[sortKey][item]={bucket:bucketKey, ok:isCorrect};
  save(); render();
};
window.unSort=function(sortKey,item){ if(state.sorters[sortKey]) delete state.sorters[sortKey][item]; save(); render(); };

function trainerBody(idx){ return TRAINER_BODIES[idx] ? TRAINER_BODIES[idx]() : ''; }
function trainerFabula(text){ return `<div class="card accent-left" style="margin-bottom:14px;"><p style="font-size:13.5px;"><i>${text}</i></p></div>`; }
function trainerVopros(text){ return `<p class="q" style="font-weight:700;color:var(--navy);margin:14px 0 10px;">${text}</p>`; }
function trainerStatusBtns(i){
  const st = state.trainerStatus[i];
  return `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;">
    <button class="btn ${st==='done'?'btn-navy':'btn-outline'}" style="${st!=='done'?'color:var(--navy);border-color:var(--navy);':''}" onclick="setTrainerStatus(${i},'done')">✓ Пройдено</button>
    <button class="btn ${st==='review'?'btn-navy':'btn-outline'}" style="${st!=='review'?'color:var(--navy);border-color:var(--navy);':''}" onclick="setTrainerStatus(${i},'review')">Нужно повторить</button>
  </div>`;
}
window.setTrainerStatus=function(i,v){ state.trainerStatus[i]=(state.trainerStatus[i]===v?undefined:v); save(); render(); };

window.exportAnswers=async function(){
  const status=document.getElementById('export-status');
  try{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='tema12-otvety.json'; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    if(status) status.textContent='Файл с ответами скачан.';
  }catch(e){ if(status) status.textContent='Не удалось сформировать файл.'; }
};

/* ============================================================

const state = load() || {slide:0, stage:{}, answers:{}, reveals:{}, sorters:{}, multiSel:{}, multiSelChecked:{}, refl:{}, currentCase:null, trainerStatus:{}, mapBranch:null, teacherMode:true};
if(!state.sorters) state.sorters={};
if(!state.multiSel) state.multiSel={};
if(!state.multiSelChecked) state.multiSelChecked={};
if(!state.refl) state.refl={};
if(!state.trainerStatus) state.trainerStatus={};
if(state.mapBranch===undefined) state.mapBranch=null;
if(state.teacherMode===undefined) state.teacherMode=true;
function save(){try{localStorage.setItem('mnu_labor_law_topic12',JSON.stringify(state));}catch(e){}}
function load(){try{const s=localStorage.getItem('mnu_labor_law_topic12');return s?JSON.parse(s):null;}catch(e){return null;}}

let currentScreen='cover';
let currentTrainer=null;

function goTo(screen){ currentScreen=screen; currentTrainer=null; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function openTrainer(i){ currentScreen='trainers'; currentTrainer=i; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function openCase(i){ currentScreen='cases'; state.currentCase=i; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function goTo12(){ currentScreen='presentation'; currentTrainer=null; goSlide(0,'full'); }
window.toggleMode=function(){ state.teacherMode=!state.teacherMode; save(); render(); };

function goSlide(i, revealMode){
  state.slide = Math.max(0, Math.min(SLIDES.length-1, i));
  const s = SLIDES[state.slide];
  if(revealMode==='full') state.stage[state.slide] = s.maxStep||0;
  else if(revealMode==='reset') state.stage[state.slide] = 0;
  save(); render(); window.scrollTo({top:0,behavior:'smooth'});
}
function advanceSlide(){
  const i=state.slide, s=SLIDES[i], max=s.maxStep||0, cur=state.stage[i]||0;
  if(cur<max){ state.stage[i]=cur+1; save(); render(); return; }
  if(i<SLIDES.length-1) goSlide(i+1,'reset'); else render();
}
function backSlide(){
  const i=state.slide, cur=state.stage[i]||0;
  if(cur>0){ state.stage[i]=cur-1; save(); render(); return; }
  if(i>0) goSlide(i-1,'full');
}
document.addEventListener('keydown', (e)=>{
  if(currentScreen!=='presentation') return;
  if(['ArrowRight','PageDown',' ','Spacebar'].includes(e.key)){ e.preventDefault(); advanceSlide(); }
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); backSlide(); }
});

function renderQr(id){
  const url = document.getElementById(`qrurl-${id}`).value.trim();
  const box = document.getElementById(`qrbox-${id}`);
  if(!box) return;
  box.innerHTML='';
  if(!url){ box.innerHTML='<span style="font-size:10px;color:#999;">QR</span>'; return; }
  if(typeof QRCode==='undefined'){ box.innerHTML='<span style="font-size:9px;color:#c8102e;padding:4px;text-align:center;">Библиотека QR не загрузилась</span>'; return; }
  try{ new QRCode(box, {text:url, width:88, height:88, colorDark:"#0c2340", colorLight:"#ffffff"}); }
  catch(e){ box.innerHTML='<span style="font-size:9px;color:#c8102e;">ошибка</span>'; }
}

function render(){
  const app=document.getElementById('app');
  let html='';
  switch(currentScreen){
    case 'cover': html=screenCover(); break;
    case 'map': html=screenMap(); break;
    case 'presentation': html=screenPresentation(); break;
    case 'cases': html=screenCases(); break;
    case 'trainers': html=screenTrainers(); break;
    case 'selfcheck': html=screenSelfCheck(); break;
    case 'after': html=screenAfter(); break;
    default: html=screenCover();
  }
  app.innerHTML = `<div class="screen active">${html}</div>`;
  updateProgress();
  autoRenderQrZones();
  const mb=document.getElementById('modeToggleBtn');
  if(mb){ mb.textContent = state.teacherMode ? 'Режим преподавателя' : 'Режим студента'; mb.className = 'mode-toggle'+(state.teacherMode?'':' student'); }
}
function updateProgress(){
  const order=['cover','map','presentation','cases','trainers','selfcheck','after'];
  let pct=0;
  if(currentScreen==='presentation'){ pct = 10 + (state.slide/(SLIDES.length-1))*60; }
  else{ const idx=order.indexOf(currentScreen); pct = [3,6,10,78,85,92,100][idx] ?? 0; }
  document.getElementById('progressFill').style.width=pct+'%';
}
render();
</script>
