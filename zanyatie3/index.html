<script>
/* ============================================================
   ДАННЫЕ ЗАНЯТИЯ №3 — ИСТОЧНИКИ И ФОРМУЛА ТРУДОВОГО ПРАВА
   ============================================================ */
const ROADMAP_NODES = ["Миссия трудового права","Метод и принципы","Источники трудового права","Действующее право РК","Международные договоры","НПА","Соглашения соц. партнёрства","Коллективные договоры","Акты работодателя","Трудовые договоры","Судебная практика","Формула трудового права","In favorem","Судебные кейсы","Тренажёры"];

function logoSVG(){return `<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="6" fill="#c8102e"/><text x="32" y="30" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="700" font-size="22" fill="#fff">MNU</text><path d="M18 46 L32 37 L46 46 Z" fill="none" stroke="#fff" stroke-width="2.5"/><rect x="16" y="46" width="4" height="8" fill="#fff"/><rect x="24" y="46" width="4" height="8" fill="#fff"/><rect x="32" y="46" width="4" height="8" fill="#fff"/><rect x="40" y="46" width="4" height="8" fill="#fff"/><rect x="14" y="54" width="36" height="3" fill="#fff"/></svg>`;}
function statCard(num,lbl){return `<div class="stat-card"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`;}
function infoCard(title,body){return `<div class="card"><h3>${title}</h3><p>${body}</p></div>`;}
function numList(items){return `<ol style="padding-left:20px;font-size:14px;color:var(--graphite-soft);line-height:1.85;">${items.map(i=>`<li>${i}</li>`).join("")}</ol>`;}
function flowRow(items){return `<div class="roadmap">${items.map((it,i)=>`<div class="node">${it}</div>${i<items.length-1?'<div class="arrow">→</div>':''}`).join("")}</div>`;}
function verticalFlow(items,opts){
  opts=opts||{};
  return `<div class="map-flow">${items.map((n,i)=>`<div class="map-node ${opts.zoneIdx&&opts.zoneIdx.includes(i)?'zone':''}">${n}</div>${i<items.length-1?'<div class="map-arrow">↓</div>':''}`).join("")}${opts.final?`<div class="map-arrow">↓</div><div class="map-node final">${opts.final}</div>`:''}</div>`;
}
function timelineStep(n,title,sub){return `<div class="timeline-step" data-n="${n}"><h4>${title}</h4>${sub?`<p>${sub}</p>`:""}</div>`;}
function qrZone(id,label,placeholderUrl,prefillUrl){
  return `<div class="qr-zone">
    <div class="qr-box" id="qrbox-${id}"><span style="font-size:10px;color:#999;">QR</span></div>
    <div class="qr-meta"><b>${label}</b>
      <input type="text" id="qrurl-${id}" placeholder="Вставьте ссылку (${placeholderUrl})" value="${prefillUrl||''}" />
      <button onclick="renderQr('${id}')">Показать QR-код</button>
    </div></div>`;
}
function autoRenderQrZones(){
  document.querySelectorAll('input[id^="qrurl-"]').forEach(input=>{
    if(input.value && input.value.trim()){
      const id = input.id.replace('qrurl-','');
      renderQr(id);
    }
  });
}
function choiceListFull(id,opts,correctIdx,explain){
  const letters=["A","B","C","D"];
  return `<div id="choice-${id}">${opts.map((o,i)=>`<button class="choice" onclick="pickChoiceExplain('${id}',${i},${correctIdx},\`${(explain||"").replace(/`/g,"'")}\`)" id="choice-${id}-${i}"><b>${letters[i]}.</b> ${o}</button>`).join("")}
  <div class="explain-box" id="explain-${id}" style="display:none;"></div></div>`;
}
window.pickChoiceExplain=function(id,i,correctIdx,explain){
  for(let j=0;j<5;j++){const el=document.getElementById(`choice-${id}-${j}`);if(el)el.classList.remove('correct','wrong');}
  const el=document.getElementById(`choice-${id}-${i}`);
  if(el){ if(i===correctIdx) el.classList.add('correct'); else { el.classList.add('wrong'); const c=document.getElementById(`choice-${id}-${correctIdx}`); if(c) c.classList.add('correct'); } }
  const ex=document.getElementById(`explain-${id}`);
  if(ex){ ex.className='explain-box '+(i===correctIdx?'ok':'no'); ex.style.display='block'; ex.innerHTML=(i===correctIdx?'✓ Верно. ':'✕ Неверно. ')+(explain||''); }
  state.answers[id]=i; save();
};
function revealBox(id, question, answer){
  const open = state.reveals[id];
  return `<div class="card" style="margin-bottom:12px;">
    <p style="font-size:13.5px;color:var(--graphite);margin:0 0 10px;">${question}</p>
    <button class="navbtn" onclick="toggleReveal('${id}')">${open?'Скрыть эталонный ответ':'Показать эталонный ответ'}</button>
    ${open?`<div class="explain-box info" style="margin-top:10px;">${answer}</div>`:""}
  </div>`;
}
window.toggleReveal=function(id){ state.reveals[id]=!state.reveals[id]; save(); render(); };

  leftLabel=leftLabel||"Работник"; rightLabel=rightLabel||"Работодатель";
  const tilt=(rightPct-leftPct)/8;
  return `<div class="scale-wrap"><svg viewBox="0 0 320 180" width="260" height="150">
    <line x1="160" y1="20" x2="160" y2="140" stroke="#0c2340" stroke-width="6" stroke-linecap="round"/>
    <rect x="140" y="140" width="40" height="14" rx="3" fill="#0c2340"/>
    <g transform="rotate(${tilt} 160 30)">
      <line x1="40" y1="30" x2="280" y2="30" stroke="#2b2e33" stroke-width="4" stroke-linecap="round"/>
      <line x1="60" y1="30" x2="60" y2="66" stroke="#8a8f98" stroke-width="2"/>
      <ellipse cx="60" cy="66" rx="20" ry="7" fill="#dfe3ea" stroke="#8a8f98" stroke-width="1.5"/>
      <line x1="260" y1="30" x2="260" y2="66" stroke="#7c1327" stroke-width="2"/>
      <ellipse cx="260" cy="66" rx="20" ry="7" fill="#c8102e" stroke="#7c1327" stroke-width="1.5"/>

}

  size=size||64;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}">
    <circle cx="50" cy="50" r="46" fill="none" stroke="#0c2340" stroke-width="3"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#dfdbd2" stroke-width="1"/>
    <polygon points="50,14 58,50 50,86 42,50" fill="#c8102e"/>
    <polygon points="14,50 50,42 86,50 50,58" fill="#0c2340"/>
    <circle cx="50" cy="50" r="4" fill="#7c1327"/>
    <text x="50" y="10" text-anchor="middle" font-size="8" fill="#0c2340" font-family="Inter,sans-serif" font-weight="700">N</text>
  </svg>`;
}
function filterSVG(size){
  size=size||70;
  return `<svg viewBox="0 0 100 110" width="${size}" height="${size*1.1}">

}
function campusSVG(){

function ladderWidget(rungs){
  const colors=["#0c2340","#123058","#585c63","#7c1327","#c8102e"];
  return `<div class="ladder">${rungs.map((r,i)=>`<div class="rung" style="background:${colors[i%colors.length]};"><span>${r}</span><span class="tag">${i===0?'минимум':i===rungs.length-1?'может быть лучше':'≥ закона'}</span></div>`).join("")}</div>`;
}
function pyramidWidget(levels){
  const n=levels.length;
  const colors=["#0c2340","#123058","#1a3a63","#585c63","#7c1327","#93172c","#a91d31","#c8102e"];
  return `<div class="pyramid">${levels.map((l,i)=>{
    const width = 100 - i*(60/Math.max(n-1,1));
    return `<div class="level" style="width:${width}%;background:${colors[Math.min(i,colors.length-1)]};">${l.title}${l.sub?`<small>${l.sub}</small>`:''}</div>`;
  }).join("")}</div>`;
}

/* stepped reveal helper */
function steps(stage, items){ return items.filter((_,i)=>stage>=i+1).join(""); }
function stepHint(stage,max){ return stage<max ? `<div class="step-hint">Нажмите «Далее» / клавишу клика, чтобы показать ещё (${stage}/${max})</div>` : ""; }

/* ranking exercise (сортировка по иерархии кликом, без drag-and-drop) */
function rankingExercise(key, items){
  const chosen = state.rankings[key] || [];
  const pool = items.filter(x=>!chosen.includes(x));
  const checked = state.rankChecked[key];
  return `
  <div class="pool" style="margin-bottom:14px;">${pool.map(x=>`<span class="chip" onclick="pickRank('${key}','${x.replace(/'/g,"\\'")}',${items.length})">${x}</span>`).join("")||'<span class="note">Все карточки расставлены.</span>'}</div>
  <div class="bucket" style="min-height:100px;"><h4>Ваш порядок (от высшей силы к низшей)</h4>
    ${chosen.map((x,i)=>{
      let cls='';
      if(checked) cls = (items[i]===x) ? 'correct' : 'wrong';
      return `<div class="rank-item ${cls}"><span><span class="pos">${i+1}.</span>${x}</span><button class="navbtn" style="padding:3px 10px;font-size:11px;" onclick="unRank('${key}','${x.replace(/'/g,"\\'")}')">убрать</button></div>`;
    }).join("")}
  </div>
  ${chosen.length===items.length ? `<button class="btn btn-navy" style="margin-top:12px;" onclick="checkRank('${key}')">Проверить порядок</button>` : ''}
  ${checked?`<div class="explain-box ${chosen.every((x,i)=>items[i]===x)?'ok':'no'}" style="margin-top:12px;">${chosen.every((x,i)=>items[i]===x)?'✓ Порядок верный.':'✕ Есть ошибки — красным отмечены позиции не на своём месте.'}</div>`:''}`;
}
window.pickRank=function(key,item,total){
  if(!state.rankings[key]) state.rankings[key]=[];
  state.rankings[key].push(item);
  state.rankChecked[key]=false;
  save(); render();
};
window.unRank=function(key,item){
  state.rankings[key]=(state.rankings[key]||[]).filter(x=>x!==item);
  state.rankChecked[key]=false;
  save(); render();
};
window.checkRank=function(key){ state.rankChecked[key]=true; save(); render(); };

function bucketSorter(sortKey, items, buckets){
  const placed = state.sorters[sortKey];
  const pool = items.filter(([txt])=>!(txt in placed));
  const cols = Math.min(buckets.length,4);
  return `
  <div class="pool" style="margin-bottom:14px;">${pool.map(([txt,correct])=>`
    <span class="chip">${txt}
      ${buckets.map(b=>`<button onclick="sortPick('${sortKey}','${txt.replace(/'/g,"\\'")}','${b.key}',${b.key===correct})">→${b.label.split(' ')[0]}</button>`).join("")}
    </span>`).join("")||'<span class="note">Все карточки распределены.</span>'}</div>
  <div class="sort-layout ${cols===3?'cols-3':cols===4?'cols-4':''}">
    ${buckets.map(b=>`<div class="bucket"><h4>${b.label}</h4>${Object.entries(placed).filter(([,v])=>v.bucket===b.key).map(([txt,v])=>`<span class="chip" style="border-color:${v.ok?'#1f6f43':'#c8102e'};" onclick="unSort('${sortKey}','${txt.replace(/'/g,"\\'")}')">${v.ok?'✓':'✕'} ${txt}</span>`).join("")}</div>`).join("")}
  </div>`;
}
window.sortPick=function(sortKey,item,bucketKey,isCorrect){
  state.sorters[sortKey][item]={bucket:bucketKey, ok:isCorrect};
  save(); render();
};
window.unSort=function(sortKey,item){ delete state.sorters[sortKey][item]; save(); render(); };

  ["t7-q1","t7-q2","t7-q3","t7-q4","t7-q5"].forEach(id=>{out += (state.refl[id]||"(нет ответа)")+"\n";});
  out += "\n— Тренажёр 12 (финальная рефлексия) —\n";
  ["r1","r2","r3","r4","r5","r6","r7","r8","r9","r10"].forEach(id=>{out += (state.refl[id]||"(нет ответа)")+"\n";});

window.exportAnswers=async function(){
  const out = buildAnswersText();
  const status = document.getElementById('export-status');
  if(window.claude && window.claude.use){
    try{
      const downloads = await window.claude.use('downloads');
      if(downloads){
        await downloads.save({filename:"otvety-zanyatie3-trudovoe-pravo.txt", data: out});
        if(status) status.textContent = 'Файл сохранён.';
        return;
      }
    }catch(e){ /* fall through */ }
  }
  try{
    const blob = new Blob([out], {type:"text/plain;charset=utf-8"});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "otvety-zanyatie3-trudovoe-pravo.txt";
    document.body.appendChild(a); a.click(); a.remove();
    if(status) status.textContent = 'Файл сохранён.';
  }catch(e){
    try{ await navigator.clipboard.writeText(out); if(status) status.textContent = 'Ответы скопированы в буфер обмена.'; }
    catch(e2){ if(status) status.textContent = 'Не удалось сохранить — выделите текст ответов вручную.'; }
  }
};

if(!state.sorters) state.sorters={};

function save(){try{localStorage.setItem('mnu_labor_law_lesson3',JSON.stringify(state));}catch(e){}}
function load(){try{const s=localStorage.getItem('mnu_labor_law_lesson3');return s?JSON.parse(s):null;}catch(e){return null;}}

let currentScreen='cover';
let currentTrainer=null;

function goTo(screen){ currentScreen=screen; currentTrainer=null; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function openTrainer(i){ currentScreen='trainers'; currentTrainer=i; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function goToCases(){ currentScreen='presentation'; currentTrainer=null; goSlide(32,'full'); }

function goSlide(i, revealMode){
  state.slide = Math.max(0, Math.min(SLIDES.length-1, i));
  const s = SLIDES[state.slide];
  if(revealMode==='full') state.stage[state.slide] = s.maxStep||0;
  else if(revealMode==='reset') state.stage[state.slide] = 0;
  save(); render(); window.scrollTo({top:0,behavior:'smooth'});
}
function advanceSlide(){
  const i=state.slide, s=SLIDES[i], max=s.maxStep||0, cur=state.stage[i]||0;
  if(cur<max){ state.stage[i]=cur+1; save(); render(); return; }
  if(i<SLIDES.length-1) goSlide(i+1,'reset'); else render();
}
function backSlide(){
  const i=state.slide, cur=state.stage[i]||0;
  if(cur>0){ state.stage[i]=cur-1; save(); render(); return; }
  if(i>0) goSlide(i-1,'full');
}
document.addEventListener('keydown', (e)=>{
  if(currentScreen!=='presentation') return;
  if(['ArrowRight','PageDown',' ','Spacebar'].includes(e.key)){ e.preventDefault(); advanceSlide(); }
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); backSlide(); }
});

function renderQr(id){
  const url = document.getElementById(`qrurl-${id}`).value.trim();
  const box = document.getElementById(`qrbox-${id}`);
  if(!box) return;
  box.innerHTML='';
  if(!url){ box.innerHTML='<span style="font-size:10px;color:#999;">QR</span>'; return; }
  if(typeof QRCode==='undefined'){ box.innerHTML='<span style="font-size:9px;color:#c8102e;padding:4px;text-align:center;">Библиотека QR не загрузилась</span>'; return; }
  try{ new QRCode(box, {text:url, width:88, height:88, colorDark:"#0c2340", colorLight:"#ffffff"}); }
  catch(e){ box.innerHTML='<span style="font-size:9px;color:#c8102e;">ошибка</span>'; }
}
